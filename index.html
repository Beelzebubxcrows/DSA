 : b;\nreturn dummy.next;\n```\n\n## Pitfalls\n\n- Losing the reference to `next` before you rewire the pointers.\n- Not checking `fast != null && fast.next != null`, which throws a `NullPointerException`.\n- Forgetting to cut the list (`mid.next = null`) when splitting it.\n- `==` on nodes compares references, which is what you want for \"same node\". Compare values with `.val`.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 206 | [Reverse Linked List](https://leetcode.com/problems/reverse-linked-list/) | E | Reversal |\n| [ ] | 21 | [Merge Two Sorted Lists](https://leetcode.com/problems/merge-two-sorted-lists/) | E | Dummy node |\n| [ ] | 141 | [Linked List Cycle](https://leetcode.com/problems/linked-list-cycle/) | E | Fast/slow |\n| [ ] | 876 | [Middle of the Linked List](https://leetcode.com/problems/middle-of-the-linked-list/) | E | Fast/slow |\n| [ ] | 19 | [Remove Nth Node From End of List](https://leetcode.com/problems/remove-nth-node-from-end-of-list/) | M | Gap |\n| [ ] | 143 | [Reorder List](https://leetcode.com/problems/reorder-list/) | M | Middle + reverse + merge |\n| [ ] | 2 | [Add Two Numbers](https://leetcode.com/problems/add-two-numbers/) | M | Carry |\n| [ ] | 138 | [Copy List with Random Pointer](https://leetcode.com/problems/copy-list-with-random-pointer/) | M | Hash map / interleave |\n| [ ] | 142 | [Linked List Cycle II](https://leetcode.com/problems/linked-list-cycle-ii/) | M | Floyd cycle start |\n| [ ] | 287 | [Find the Duplicate Number](https://leetcode.com/problems/find-the-duplicate-number/) | M | Array as a linked list |\n| [ ] | 146 | [LRU Cache](https://leetcode.com/problems/lru-cache/) | M | Hash map + doubly linked list ⭐ |\n| [ ] | 23 | [Merge k Sorted Lists](https://leetcode.com/problems/merge-k-sorted-lists/) | H | Heap / divide and conquer |\n| [ ] | 25 | [Reverse Nodes in k-Group](https://leetcode.com/problems/reverse-nodes-in-k-group/) | H | Reverse in chunks |\n\n⭐ = very frequently asked\n\n## My Notes\n\n-\n"}, {"id": "07-Trees", "file": "07-Trees.md", "title": "07 · Trees", "md": "# 07 · Trees\n\n> **Prereqs:** recursion basics · **Time:** 5–6 days (this topic comes up a lot)\n\n## When to use\n\n- The input is a binary tree or BST, a hierarchy, or a parsed structure.\n- Questions about depth, diameter, paths, ancestors, level-by-level views, or serialization.\n\n## Core concepts\n\n- **DFS orders**: pre-order (node, left, right), in-order (left, node, right; **gives sorted order for a BST**), and post-order (left, right, node; use it when a parent needs results from its children).\n- **BFS / level order**: uses a queue and processes the tree one level at a time.\n- **BST property**: every value in the left subtree is less than the node, which is less than every value in the right subtree. Validate with **min and max bounds**, not by comparing each node only with its children.\n- **The \"return one thing, update a global\" pattern**: used for diameter and maximum path sum. The recursive call returns the best single branch, and a global variable tracks the best path that passes through the current node.\n- Height is O(log n) if the tree is balanced and O(n) if it's skewed. That height is the recursion stack space.\n\n## Templates\n\n```java\n// DFS returning a value (height)\nint height(TreeNode node) {\n    if (node == null) return 0;\n    return 1 + Math.max(height(node.left), height(node.right));\n}\n\n// Return-one, update-global (diameter)\nint best = 0;   // a field, so the recursive method can update it\nint dfs(TreeNode node) {\n    if (node == null) return 0;\n    int L = dfs(node.left), R = dfs(node.right);\n    best = Math.max(best, L + R);\n    return 1 + Math.max(L, R);\n}\n\n// BFS level order\nList<List<Integer>> res = new ArrayList<>();\nQueue<TreeNode> q = new ArrayDeque<>();\nif (root != null) q.offer(root);\nwhile (!q.isEmpty()) {\n    List<Integer> level = new ArrayList<>();\n    for (int size = q.size(); size > 0; size--) {\n        TreeNode node = q.poll();\n        level.add(node.val);\n        if (node.left != null) q.offer(node.left);\n        if (node.right != null) q.offer(node.right);\n    }\n    res.add(level);\n}\n\n// Validate BST with bounds (long, so nodes equal to Integer.MIN/MAX_VALUE still pass)\nboolean valid(TreeNode node, long lo, long hi) {\n    if (node == null) return true;\n    if (node.val <= lo || node.val >= hi) return false;\n    return valid(node.left, lo, node.val) && valid(node.right, node.val, hi);\n}\n// call: valid(root, Long.MIN_VALUE, Long.MAX_VALUE)\n\n// Iterative inorder\nDeque<TreeNode> st = new ArrayDeque<>();\nTreeNode cur = root;\nwhile (!st.isEmpty() || cur != null) {\n    while (cur != null) {\n        st.push(cur);\n        cur = cur.left;\n    }\n    cur = st.pop();\n    visit(cur);\n    cur = cur.right;\n}\n```\n\n## Pitfalls\n\n- Validating a BST by comparing each node only with its direct children.\n- BST bounds as `int`: a node holding `Integer.MAX_VALUE` fails a `< Integer.MAX_VALUE` check. Use `long` bounds or nullable `Integer` bounds.\n- BFS: writing `for (int i = 0; i < q.size(); i++)` while adding children. `q.size()` changes inside the loop, so read it once first.\n- Handling `null` children inconsistently.\n- Max path sum: forgetting to clamp negative branches to 0.\n- Java's default stack allows a recursion depth of roughly 10⁴, so a skewed tree with 10⁵ nodes can throw `StackOverflowError`. Mention this in the interview and offer the iterative version.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 226 | [Invert Binary Tree](https://leetcode.com/problems/invert-binary-tree/) | E | DFS |\n| [ ] | 104 | [Maximum Depth of Binary Tree](https://leetcode.com/problems/maximum-depth-of-binary-tree/) | E | DFS |\n| [ ] | 100 | [Same Tree](https://leetcode.com/problems/same-tree/) | E | DFS on two trees |\n| [ ] | 572 | [Subtree of Another Tree](https://leetcode.com/problems/subtree-of-another-tree/) | E | Same Tree at every node |\n| [ ] | 110 | [Balanced Binary Tree](https://leetcode.com/problems/balanced-binary-tree/) | E | Height + flag |\n| [ ] | 543 | [Diameter of Binary Tree](https://leetcode.com/problems/diameter-of-binary-tree/) | E | Return-one, update-global |\n| [ ] | 102 | [Binary Tree Level Order Traversal](https://leetcode.com/problems/binary-tree-level-order-traversal/) | M | BFS |\n| [ ] | 199 | [Binary Tree Right Side View](https://leetcode.com/problems/binary-tree-right-side-view/) | M | BFS, last node per level |\n| [ ] | 1448 | [Count Good Nodes in Binary Tree](https://leetcode.com/problems/count-good-nodes-in-binary-tree/) | M | Pass the max down |\n| [ ] | 98 | [Validate Binary Search Tree](https://leetcode.com/problems/validate-binary-search-tree/) | M | Bounds |\n| [ ] | 230 | [Kth Smallest Element in a BST](https://leetcode.com/problems/kth-smallest-element-in-a-bst/) | M | In-order |\n| [ ] | 235 | [Lowest Common Ancestor of a BST](https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-search-tree/) | M | Use the BST property |\n| [ ] | 236 | [Lowest Common Ancestor of a Binary Tree](https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/) | M | Post-order ⭐ |\n| [ ] | 105 | [Construct Binary Tree from Preorder and Inorder Traversal](https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/) | M | Index map |\n| [ ] | 124 | [Binary Tree Maximum Path Sum](https://leetcode.com/problems/binary-tree-maximum-path-sum/) | H | Return-one, update-global ⭐ |\n| [ ] | 297 | [Serialize and Deserialize Binary Tree](https://leetcode.com/problems/serialize-and-deserialize-binary-tree/) | H | Pre-order with null markers |\n\n## My Notes\n\n-\n"}, {"id": "08-Tries", "file": "08-Tries.md", "title": "08 · Tries", "md": "# 08 · Tries\n\n> **Prereqs:** 07 · **Time:** 1–2 days\n\n## When to use\n\n- **Prefix** queries: autocomplete, \"starts with\", or replacing words with their roots.\n- Searching for many words in a grid at once (Word Search II).\n- Wildcard matching against a dictionary.\n- **Bitwise trie**: maximising XOR between pairs of numbers.\n\n## Core concepts\n\n- Each node holds `Node[] children = new Node[26]` for lowercase letters (or a `Map<Character, Node>` for a larger alphabet) and an `end` flag (or stores the word itself).\n- Insert and search take O(L) time, where L is the word length. Space is O(total number of characters).\n- To handle wildcards such as `.`, run a DFS over every child at that position.\n\n## Template\n\n```java\n// Trie (lowercase letters)\nclass Trie {\n    private static class Node {\n        Node[] children = new Node[26];\n        boolean end;\n    }\n    private final Node root = new Node();\n\n    public void insert(String word) {\n        Node node = root;\n        for (char c : word.toCharArray()) {\n            int i = c - 'a';\n            if (node.children[i] == null) node.children[i] = new Node();\n            node = node.children[i];\n        }\n        node.end = true;\n    }\n\n    private Node walk(String s) {\n        Node node = root;\n        for (char c : s.toCharArray()) {\n            node = node.children[c - 'a'];\n            if (node == null) return null;\n        }\n        return node;\n    }\n\n    public boolean search(String word) {\n        Node n = walk(word);\n        return n != null && n.end;\n    }\n\n    public boolean startsWith(String prefix) {\n        return walk(prefix) != null;\n    }\n}\n```\n\n## Pitfalls\n\n- Word Search II: you need to **prune** found words from the trie, or the solution exceeds the time limit.\n- Forgetting the `end` flag, which makes `search(\"app\")` return true when only \"apple\" was inserted.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 14 | [Longest Common Prefix](https://leetcode.com/problems/longest-common-prefix/) | E | Warm-up (no trie needed) |\n| [ ] | 208 | [Implement Trie (Prefix Tree)](https://leetcode.com/problems/implement-trie-prefix-tree/) | M | Core |\n| [ ] | 211 | [Design Add and Search Words Data Structure](https://leetcode.com/problems/design-add-and-search-words-data-structure/) | M | Wildcard DFS |\n| [ ] | 648 | [Replace Words](https://leetcode.com/problems/replace-words/) | M | Shortest prefix |\n| [ ] | 1268 | [Search Suggestions System](https://leetcode.com/problems/search-suggestions-system/) | M | Prefix + sorting |\n| [ ] | 421 | [Maximum XOR of Two Numbers in an Array](https://leetcode.com/problems/maximum-xor-of-two-numbers-in-an-array/) | M | Bitwise trie |\n| [ ] | 212 | [Word Search II](https://leetcode.com/problems/word-search-ii/) | H | Trie + grid DFS ⭐ |\n\n## My Notes\n\n-\n"}, {"id": "09-Heaps", "file": "09-Heaps.md", "title": "09 · Heaps / Priority Queue", "md": "# 09 · Heaps / Priority Queue\n\n> **Prereqs:** 01 · **Time:** 2–3 days\n\n## When to use\n\n- \"Top K\", \"Kth largest or smallest\", \"K closest\".\n- Repeatedly taking the min or max as the data changes (scheduling, simulations).\n- Merging K sorted lists or streams.\n- **Median of a stream**: use two heaps.\n- Dijkstra's algorithm and Prim's algorithm (topic 12).\n\n## Core concepts\n\n- A binary heap gives O(log n) push and pop and O(1) peek. Building one from a whole collection (`new PriorityQueue<>(list)`) takes O(n).\n- Java's `PriorityQueue` is a **min-heap** by default. For a max-heap, use `new PriorityQueue<>(Collections.reverseOrder())`.\n- **Top K largest**: keep a **min-heap of size K**. This takes O(n log k).\n- For pairs or objects, pass a comparator, e.g. `new PriorityQueue<int[]>((a, b) -> Integer.compare(a[0], b[0]))`.\n- **Two heaps for the median**: a max-heap holds the lower half and a min-heap holds the upper half. Keep their sizes within 1 of each other.\n- **Quickselect** finds the Kth element in O(n) on average. It's a good optimisation to mention.\n\n## Templates\n\n```java\n// K largest with min-heap of size k\nPriorityQueue<Integer> h = new PriorityQueue<>();\nfor (int x : nums) {\n    h.offer(x);\n    if (h.size() > k) h.poll();\n}\nreturn h.peek();   // kth largest\n\n// Max-heap\nPriorityQueue<Integer> maxH = new PriorityQueue<>(Collections.reverseOrder());\n\n// Merge k sorted lists\nPriorityQueue<ListNode> h = new PriorityQueue<>((a, b) -> Integer.compare(a.val, b.val));\nfor (ListNode node : lists) if (node != null) h.offer(node);\nListNode dummy = new ListNode(), tail = dummy;\nwhile (!h.isEmpty()) {\n    ListNode node = h.poll();\n    tail.next = node;\n    tail = node;\n    if (node.next != null) h.offer(node.next);\n}\n\n// Two heaps median\nPriorityQueue<Integer> lo = new PriorityQueue<>(Collections.reverseOrder());   // lower half, max-heap\nPriorityQueue<Integer> hi = new PriorityQueue<>();                             // upper half, min-heap\nvoid add(int x) {\n    lo.offer(x);\n    hi.offer(lo.poll());\n    if (hi.size() > lo.size()) lo.offer(hi.poll());\n}\ndouble median() {\n    return lo.size() > hi.size() ? lo.peek() : ((double) lo.peek() + hi.peek()) / 2;\n}\n```\n\n## Pitfalls\n\n- Adding arrays or custom objects without a comparator, which throws `ClassCastException`.\n- Writing the comparator as `(a, b) -> b - a`. It overflows for large or negative values. Use `Integer.compare(b, a)` or `Collections.reverseOrder()`.\n- Iterating over a `PriorityQueue` (or printing it) doesn't give sorted order. Only repeated `poll()` does.\n- Using a heap when sorting once would be simpler.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 703 | [Kth Largest Element in a Stream](https://leetcode.com/problems/kth-largest-element-in-a-stream/) | E | Min-heap of size k |\n| [ ] | 1046 | [Last Stone Weight](https://leetcode.com/problems/last-stone-weight/) | E | Max-heap |\n| [ ] | 973 | [K Closest Points to Origin](https://leetcode.com/problems/k-closest-points-to-origin/) | M | Heap of size k ⭐ |\n| [ ] | 215 | [Kth Largest Element in an Array](https://leetcode.com/problems/kth-largest-element-in-an-array/) | M | Heap / quickselect |\n| [ ] | 621 | [Task Scheduler](https://leetcode.com/problems/task-scheduler/) | M | Heap + cooldown queue |\n| [ ] | 767 | [Reorganize String](https://leetcode.com/problems/reorganize-string/) | M | Greedy with a max-heap |\n| [ ] | 355 | [Design Twitter](https://leetcode.com/problems/design-twitter/) | M | Merge K feeds |\n| [ ] | 295 | [Find Median from Data Stream](https://leetcode.com/problems/find-median-from-data-stream/) | H | Two heaps ⭐ |\n| [ ] | 502 | [IPO](https://leetcode.com/problems/ipo/) | H | Sort + heap |\n\n## My Notes\n\n-\n"}, {"id": "10-Backtracking", "file": "10-Backtracking.md", "title": "10 · Backtracking", "md": "# 10 · Backtracking\n\n> **Prereqs:** recursion, 07 · **Time:** 4–5 days\n\n## When to use\n\n- \"Generate **all**\" subsets, permutations, combinations, partitions or valid configurations.\n- Constraint satisfaction problems: N-Queens, Sudoku, searching for a word in a grid.\n- n is small (≤ 20 or so), so exponential time is expected.\n\n## Core concepts\n\n- The pattern is **choose → explore → un-choose**.\n- Think of the solution as a **decision tree**. Each level is one decision.\n- **Subsets**: include or skip each element. **Combinations**: pass a `start` index so you never go backwards. **Permutations**: use a `used[]` array.\n- **Handling duplicates**: sort first, then skip `nums[i] == nums[i-1]` when `i > start` (or when the previous duplicate is unused, for permutations).\n- **Pruning**: stop early once a branch can't succeed (for example, the sum already exceeds the target).\n- Complexity: subsets is O(n·2ⁿ) and permutations is O(n·n!).\n\n## Templates\n\n```java\n// Subsets / combinations\nList<List<Integer>> res = new ArrayList<>();\nList<Integer> path = new ArrayList<>();\nvoid bt(int start) {\n    res.add(new ArrayList<>(path));                        // copy!\n    for (int i = start; i < nums.length; i++) {\n        if (i > start && nums[i] == nums[i - 1]) continue;  // dedupe (sorted)\n        path.add(nums[i]);\n        bt(i + 1);                                          // i (not i + 1) if reuse allowed\n        path.remove(path.size() - 1);\n    }\n}\n\n// Permutations\nboolean[] used = new boolean[n];\nvoid bt() {\n    if (path.size() == n) {\n        res.add(new ArrayList<>(path));\n        return;\n    }\n    for (int i = 0; i < n; i++) {\n        if (used[i]) continue;\n        used[i] = true; path.add(nums[i]);\n        bt();\n        used[i] = false; path.remove(path.size() - 1);\n    }\n}\n\n// Grid backtracking (word search)\nint[][] DIRS = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\nboolean dfs(int r, int c, int i) {\n    if (i == word.length()) return true;\n    if (r < 0 || r >= R || c < 0 || c >= C || board[r][c] != word.charAt(i)) return false;\n    char tmp = board[r][c];\n    board[r][c] = '#';\n    boolean found = false;\n    for (int[] d : DIRS)\n        if (dfs(r + d[0], c + d[1], i + 1)) { found = true; break; }\n    board[r][c] = tmp;\n    return found;\n}\n```\n\n## Pitfalls\n\n- Adding `path` instead of `new ArrayList<>(path)`, which means every result ends up pointing to the same list.\n- On a `List<Integer>`, `remove(int)` removes by index but `remove(Integer)` removes by value. Always undo with `path.remove(path.size() - 1)`.\n- Forgetting to undo the choice (the pop, or restoring a grid cell).\n- Getting the dedupe condition wrong, or forgetting to sort first.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 78 | [Subsets](https://leetcode.com/problems/subsets/) | M | Include/skip |\n| [ ] | 90 | [Subsets II](https://leetcode.com/problems/subsets-ii/) | M | Sort + dedupe |\n| [ ] | 39 | [Combination Sum](https://leetcode.com/problems/combination-sum/) | M | Reuse allowed |\n| [ ] | 40 | [Combination Sum II](https://leetcode.com/problems/combination-sum-ii/) | M | No reuse + dedupe |\n| [ ] | 46 | [Permutations](https://leetcode.com/problems/permutations/) | M | Used array |\n| [ ] | 47 | [Permutations II](https://leetcode.com/problems/permutations-ii/) | M | Used array + dedupe |\n| [ ] | 17 | [Letter Combinations of a Phone Number](https://leetcode.com/problems/letter-combinations-of-a-phone-number/) | M | Product of choices |\n| [ ] | 22 | [Generate Parentheses](https://leetcode.com/problems/generate-parentheses/) | M | Track open/close counts |\n| [ ] | 79 | [Word Search](https://leetcode.com/problems/word-search/) | M | Grid backtracking |\n| [ ] | 131 | [Palindrome Partitioning](https://leetcode.com/problems/palindrome-partitioning/) | M | Partition |\n| [ ] | 51 | [N-Queens](https://leetcode.com/problems/n-queens/) | H | Sets for columns and diagonals |\n| [ ] | 37 | [Sudoku Solver](https://leetcode.com/problems/sudoku-solver/) | H | Constraint satisfaction |\n\n## My Notes\n\n-\n"}, {"id": "11-Graphs", "file": "11-Graphs.md", "title": "11 · Graphs", "md": "# 11 · Graphs\n\n> **Prereqs:** 07, 10 · **Time:** 5–6 days\n\n## When to use\n\n- Grids (islands, flood fill), networks, dependencies, states connected by transitions.\n- \"Number of connected components\", \"can you reach X\", or \"shortest path with unweighted edges\" (use BFS).\n- Prerequisites or ordering: **topological sort**.\n- Dynamic connectivity, or detecting a cycle in an undirected graph: **Union-Find**.\n\n## Core concepts\n\n- **Representations**: an adjacency list (`List<List<Integer>>` with one `ArrayList` per node, or a `Map<Integer, List<Integer>>` for sparse labels), or an implicit grid where each cell's neighbours are found with direction vectors.\n- **DFS** is good for reachability, components, cycle detection and flood fill.\n- **BFS** gives the **shortest path in an unweighted graph**. **Multi-source BFS** starts with every source in the queue (rotting oranges, walls and gates).\n- **Topological sort (Kahn's algorithm)**: start the BFS from nodes with in-degree 0. If you process fewer than n nodes, the graph has a cycle.\n- **Cycle detection in a directed graph**: DFS with three colours (unvisited, visiting, visited).\n- **Union-Find**: path compression plus union by rank gives about O(α(n)) per operation.\n- **Bipartite check**: two-colour the graph with BFS or DFS.\n- **Reverse thinking**: start from the boundary or the target instead (Pacific Atlantic, Surrounded Regions).\n- Complexity is O(V + E). For a grid, that's O(R·C).\n\n## Templates\n\n```java\nint[][] DIRS = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\n\n// Grid DFS (flood fill)\nvoid dfs(int r, int c) {\n    if (r < 0 || r >= R || c < 0 || c >= C || grid[r][c] != '1') return;\n    grid[r][c] = '0';\n    for (int[] d : DIRS) dfs(r + d[0], c + d[1]);\n}\n\n// BFS shortest path (unweighted)\nQueue<Integer> q = new ArrayDeque<>();\nboolean[] seen = new boolean[n];\nq.offer(start); seen[start] = true;\nfor (int d = 0; !q.isEmpty(); d++) {\n    for (int size = q.size(); size > 0; size--) {\n        int node = q.poll();\n        if (node == target) return d;\n        for (int nb : adj.get(node))\n            if (!seen[nb]) { seen[nb] = true; q.offer(nb); }\n    }\n}\nreturn -1;\n\n// Topological sort (Kahn)\nList<List<Integer>> adj = new ArrayList<>();\nfor (int i = 0; i < n; i++) adj.add(new ArrayList<>());\nint[] indeg = new int[n];\nfor (int[] e : edges) { adj.get(e[0]).add(e[1]); indeg[e[1]]++; }\nQueue<Integer> q = new ArrayDeque<>();\nfor (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);\nList<Integer> order = new ArrayList<>();\nwhile (!q.isEmpty()) {\n    int u = q.poll();\n    order.add(u);\n    for (int v : adj.get(u))\n        if (--indeg[v] == 0) q.offer(v);\n}\nboolean hasCycle = order.size() < n;\n\n// Union-Find\nint[] parent = new int[n], rank = new int[n];\nfor (int i = 0; i < n; i++) parent[i] = i;\nint find(int x) {\n    while (parent[x] != x) {\n        parent[x] = parent[parent[x]];\n        x = parent[x];\n    }\n    return x;\n}\nboolean union(int a, int b) {\n    int ra = find(a), rb = find(b);\n    if (ra == rb) return false;\n    if (rank[ra] < rank[rb]) { int t = ra; ra = rb; rb = t; }\n    parent[rb] = ra;\n    if (rank[ra] == rank[rb]) rank[ra]++;\n    return true;\n}\n```\n\n## Pitfalls\n\n- Marking a node visited when you **pop** it in BFS instead of when you **push** it, which leads to duplicate work.\n- Getting the direction of prerequisite edges backwards.\n- Recursion depth on large grids: DFS on a 300×300 grid can go 90,000 calls deep and throw `StackOverflowError`. Mention that an iterative BFS avoids it.\n- Forgetting isolated nodes (nodes with no edges).\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 200 | [Number of Islands](https://leetcode.com/problems/number-of-islands/) | M | Grid DFS ⭐ |\n| [ ] | 695 | [Max Area of Island](https://leetcode.com/problems/max-area-of-island/) | M | Grid DFS |\n| [ ] | 133 | [Clone Graph](https://leetcode.com/problems/clone-graph/) | M | DFS + map from old node to new |\n| [ ] | 994 | [Rotting Oranges](https://leetcode.com/problems/rotting-oranges/) | M | Multi-source BFS ⭐ |\n| [ ] | 286 | [Walls and Gates](https://leetcode.com/problems/walls-and-gates/) 🔒 | M | Multi-source BFS |\n| [ ] | 417 | [Pacific Atlantic Water Flow](https://leetcode.com/problems/pacific-atlantic-water-flow/) | M | Reverse from the borders |\n| [ ] | 130 | [Surrounded Regions](https://leetcode.com/problems/surrounded-regions/) | M | Reverse from the borders |\n| [ ] | 547 | [Number of Provinces](https://leetcode.com/problems/number-of-provinces/) | M | DFS / Union-Find |\n| [ ] | 323 | [Number of Connected Components in an Undirected Graph](https://leetcode.com/problems/number-of-connected-components-in-an-undirected-graph/) 🔒 | M | Union-Find |\n| [ ] | 261 | [Graph Valid Tree](https://leetcode.com/problems/graph-valid-tree/) 🔒 | M | n−1 edges + connected |\n| [ ] | 785 | [Is Graph Bipartite?](https://leetcode.com/problems/is-graph-bipartite/) | M | Two-colouring |\n| [ ] | 207 | [Course Schedule](https://leetcode.com/problems/course-schedule/) | M | Topological sort / cycle ⭐ |\n| [ ] | 210 | [Course Schedule II](https://leetcode.com/problems/course-schedule-ii/) | M | Topological order |\n| [ ] | 684 | [Redundant Connection](https://leetcode.com/problems/redundant-connection/) | M | Union-Find |\n| [ ] | 1091 | [Shortest Path in Binary Matrix](https://leetcode.com/problems/shortest-path-in-binary-matrix/) | M | BFS on a grid |\n| [ ] | 127 | [Word Ladder](https://leetcode.com/problems/word-ladder/) | H | BFS over word states |\n\n## My Notes\n\n-\n"}, {"id": "12-Advanced-Graphs", "file": "12-Advanced-Graphs.md", "title": "12 · Advanced Graphs", "md": "# 12 · Advanced Graphs\n\n> **Prereqs:** 09, 11 · **Time:** 4 days\n\n## When to use\n\n- **Weighted** shortest path with non-negative weights: **Dijkstra**.\n- Shortest path with a limit on the number of edges, or with negative weights: **Bellman-Ford**.\n- Shortest paths between every pair of nodes, with small n: **Floyd–Warshall**, which is O(n³).\n- Connecting every node at the lowest total cost: **minimum spanning tree** (Prim's or Kruskal's algorithm).\n- Minimising the maximum edge along a path: a modified Dijkstra, or binary search combined with BFS.\n- Using every edge exactly once: an **Eulerian path** (Hierholzer's algorithm).\n- Critical edges or articulation points: **Tarjan's algorithm**.\n\n## Core concepts\n\n- **Dijkstra**: uses a min-heap of `(dist, node)`. When you pop an entry whose distance is out of date, skip it. Runs in O(E log V).\n- **Kruskal**: sort the edges by weight, then add each edge with Union-Find if it doesn't create a cycle. Runs in O(E log E).\n- **Prim**: grow the tree from one node, using a min-heap of the edges that cross out of the tree.\n- **Bellman-Ford**: relax every edge V−1 times. For \"at most K stops\", run K+1 rounds and copy the distance array (`dist.clone()`) each round.\n\n## Templates\n\n```java\n// Dijkstra\nint[] dist = new int[n];\nArrays.fill(dist, Integer.MAX_VALUE);\ndist[src] = 0;\nPriorityQueue<int[]> h = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));   // {dist, node}\nh.offer(new int[]{0, src});\nwhile (!h.isEmpty()) {\n    int[] top = h.poll();\n    int d = top[0], u = top[1];\n    if (d > dist[u]) continue;   // stale\n    for (int[] e : adj.get(u)) {   // e = {v, w}\n        int v = e[0], nd = d + e[1];\n        if (nd < dist[v]) {\n            dist[v] = nd;\n            h.offer(new int[]{nd, v});\n        }\n    }\n}\n\n// Kruskal (with Union-Find from topic 11)\nArrays.sort(edges, (a, b) -> Integer.compare(a[2], b[2]));\nint cost = 0;\nfor (int[] e : edges)\n    if (union(e[0], e[1])) cost += e[2];\n\n// Bellman-Ford with at most K edges\nint[] dist = new int[n];\nArrays.fill(dist, Integer.MAX_VALUE);\ndist[src] = 0;\nfor (int round = 0; round <= K; round++) {\n    int[] tmp = dist.clone();\n    for (int[] f : flights) {   // f = {u, v, w}\n        if (dist[f[0]] == Integer.MAX_VALUE) continue;   // unreachable so far\n        if (dist[f[0]] + f[2] < tmp[f[1]]) tmp[f[1]] = dist[f[0]] + f[2];\n    }\n    dist = tmp;\n}\n```\n\n## Pitfalls\n\n- Dijkstra gives wrong answers with negative edge weights.\n- Using `Integer.MAX_VALUE` as infinity and then adding a weight to it, which overflows to a negative number. Skip unreachable nodes first, or use a safe sentinel like `1_000_000_000`.\n- Bellman-Ford with a stop limit: not copying the distance array each round lets a path use more edges than allowed in one round.\n- Forgetting to skip out-of-date heap entries, which makes the algorithm much slower.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 743 | [Network Delay Time](https://leetcode.com/problems/network-delay-time/) | M | Dijkstra ⭐ |\n| [ ] | 1514 | [Path with Maximum Probability](https://leetcode.com/problems/path-with-maximum-probability/) | M | Dijkstra with a max-heap |\n| [ ] | 1631 | [Path With Minimum Effort](https://leetcode.com/problems/path-with-minimum-effort/) | M | Minimax Dijkstra |\n| [ ] | 1584 | [Min Cost to Connect All Points](https://leetcode.com/problems/min-cost-to-connect-all-points/) | M | Prim / Kruskal |\n| [ ] | 787 | [Cheapest Flights Within K Stops](https://leetcode.com/problems/cheapest-flights-within-k-stops/) | M | Bellman-Ford |\n| [ ] | 721 | [Accounts Merge](https://leetcode.com/problems/accounts-merge/) | M | Union-Find |\n| [ ] | 778 | [Swim in Rising Water](https://leetcode.com/problems/swim-in-rising-water/) | H | Minimax Dijkstra |\n| [ ] | 332 | [Reconstruct Itinerary](https://leetcode.com/problems/reconstruct-itinerary/) | H | Eulerian path |\n| [ ] | 269 | [Alien Dictionary](https://leetcode.com/problems/alien-dictionary/) 🔒 | H | Build graph + topological sort ⭐ |\n| [ ] | 1192 | [Critical Connections in a Network](https://leetcode.com/problems/critical-connections-in-a-network/) | H | Tarjan bridges |\n\n## My Notes\n\n-\n"}, {"id": "13-DP-1D", "file": "13-DP-1D.md", "title": "13 · Dynamic Programming: 1D", "md": "# 13 · Dynamic Programming: 1D\n\n> **Prereqs:** 10 · **Time:** 5–6 days\n\n## When to use\n\n- The problem asks for the **number of ways**, the **min or max**, or **is it possible**.\n- Choices made at each step lead to **overlapping subproblems** (the plain recursion tree recomputes the same states).\n- The problem has **optimal substructure**: the best answer is built from the best answers to smaller subproblems.\n\n## Framework (use it on every DP problem)\n\n1. **State**: what does `dp[i]` mean? Write it out in words.\n2. **Transition**: how do you get `dp[i]` from smaller states?\n3. **Base cases**.\n4. **Answer**: is it `dp[n]`, or `max(dp)`?\n5. **Order**: fill the table so each state's dependencies are computed first.\n6. **Optimise space**: if `dp[i]` only depends on `dp[i-1]` and `dp[i-2]`, keep two variables.\n\nStart with recursion plus memoization (top-down), then convert it to a table (bottom-up) if needed.\n\n## Common 1D shapes\n\n| Shape | Transition | Examples |\n|-------|-----------|----------|\n| Fibonacci-like | `dp[i] = dp[i-1] + dp[i-2]` | Climbing Stairs, Decode Ways |\n| Take or skip | `dp[i] = max(dp[i-1], dp[i-2] + a[i])` | House Robber |\n| Unbounded knapsack | `dp[x] = min(dp[x - c] + 1)` over each coin c | Coin Change |\n| 0/1 knapsack | iterate x **backwards** | Partition Equal Subset Sum |\n| LIS | `dp[i] = 1 + max(dp[j])` for j < i with `a[j] < a[i]` | LIS, O(n log n) with patience sorting |\n| Track max and min | keep both the current max and min | Max Product Subarray |\n| Expand around centre | not a table, O(n²) | Palindromic substrings |\n\n## Templates\n\n```java\n// Top-down (Integer[] memo, so null means \"not computed yet\")\nInteger[] memo = new Integer[n];\nint f(int i) {\n    if (i >= n) return 0;\n    if (memo[i] != null) return memo[i];\n    return memo[i] = Math.max(f(i + 1), nums[i] + f(i + 2));\n}\n\n// Bottom-up, O(1) space (House Robber)\nint prev2 = 0, prev1 = 0;\nfor (int x : nums) {\n    int cur = Math.max(prev1, prev2 + x);\n    prev2 = prev1;\n    prev1 = cur;\n}\n\n// Coin change (min coins)\nint[] dp = new int[amount + 1];\nArrays.fill(dp, amount + 1);   // \"infinity\" that can't overflow when you add 1\ndp[0] = 0;\nfor (int x = 1; x <= amount; x++)\n    for (int c : coins)\n        if (c <= x) dp[x] = Math.min(dp[x], dp[x - c] + 1);\nreturn dp[amount] > amount ? -1 : dp[amount];\n\n// 0/1 knapsack boolean\nboolean[] dp = new boolean[target + 1];\ndp[0] = true;\nfor (int x : nums)\n    for (int s = target; s >= x; s--)\n        dp[s] |= dp[s - x];\n```\n\n## Pitfalls\n\n- Not defining the state clearly enough. This causes most DP bugs.\n- 0/1 knapsack: iterating forwards, which lets you reuse the same item more than once.\n- Using `Integer.MAX_VALUE` as \"impossible\": `MAX_VALUE + 1` overflows to a negative number. Use a safe sentinel such as `amount + 1`, and convert it to `-1` at the end.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 70 | [Climbing Stairs](https://leetcode.com/problems/climbing-stairs/) | E | Fibonacci |\n| [ ] | 746 | [Min Cost Climbing Stairs](https://leetcode.com/problems/min-cost-climbing-stairs/) | E | Fibonacci with min |\n| [ ] | 198 | [House Robber](https://leetcode.com/problems/house-robber/) | M | Take or skip |\n| [ ] | 213 | [House Robber II](https://leetcode.com/problems/house-robber-ii/) | M | Two linear passes |\n| [ ] | 5 | [Longest Palindromic Substring](https://leetcode.com/problems/longest-palindromic-substring/) | M | Expand around centre |\n| [ ] | 647 | [Palindromic Substrings](https://leetcode.com/problems/palindromic-substrings/) | M | Expand around centre |\n| [ ] | 91 | [Decode Ways](https://leetcode.com/problems/decode-ways/) | M | Fibonacci-like |\n| [ ] | 322 | [Coin Change](https://leetcode.com/problems/coin-change/) | M | Unbounded knapsack ⭐ |\n| [ ] | 152 | [Maximum Product Subarray](https://leetcode.com/problems/maximum-product-subarray/) | M | Track max and min |\n| [ ] | 139 | [Word Break](https://leetcode.com/problems/word-break/) | M | dp[i] = whether the prefix can be split ⭐ |\n| [ ] | 300 | [Longest Increasing Subsequence](https://leetcode.com/problems/longest-increasing-subsequence/) | M | LIS / patience sorting |\n| [ ] | 416 | [Partition Equal Subset Sum](https://leetcode.com/problems/partition-equal-subset-sum/) | M | 0/1 knapsack |\n\n## My Notes\n\n-\n"}, {"id": "14-DP-2D", "file": "14-DP-2D.md", "title": "14 · Dynamic Programming: 2D", "md": "# 14 · Dynamic Programming: 2D\n\n> **Prereqs:** 13 · **Time:** 5–6 days\n\n## When to use\n\n- **Two sequences** to compare (LCS, edit distance, interleaving).\n- A **grid** of paths.\n- One sequence plus an extra dimension such as remaining capacity, a state machine (holding a stock or not), or an interval `[i, j]`.\n\n## Common 2D shapes\n\n| Shape | State | Transition idea |\n|-------|-------|-----------------|\n| Grid paths | `dp[r][c]` | from the cell above or to the left |\n| Two strings | `dp[i][j]` = answer for the first i chars of `a` and the first j chars of `b` | if the characters match, take the diagonal; otherwise combine the neighbours |\n| Knapsack | `dp[i][cap]` | take item i or skip it |\n| State machine | `dp[i][state]` | transitions between states such as hold, sold and cooldown |\n| Interval | `dp[l][r]` | try every split point k in `(l, r)`, iterating by length |\n\n## Templates\n\n```java\n// LCS\nint[][] dp = new int[n + 1][m + 1];\nfor (int i = 1; i <= n; i++)\n    for (int j = 1; j <= m; j++)\n        if (a.charAt(i - 1) == b.charAt(j - 1))\n            dp[i][j] = dp[i - 1][j - 1] + 1;\n        else\n            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n\n// Edit distance\nfor (int i = 0; i <= n; i++) dp[i][0] = i;\nfor (int j = 0; j <= m; j++) dp[0][j] = j;\ndp[i][j] = a.charAt(i - 1) == b.charAt(j - 1)\n        ? dp[i - 1][j - 1]\n        : 1 + Math.min(dp[i - 1][j - 1],                       // replace\n                       Math.min(dp[i - 1][j], dp[i][j - 1]));  // delete, insert\n\n// Interval DP (iterate by length)\nfor (int len = 2; len <= n; len++)\n    for (int l = 0; l + len - 1 < n; l++) {\n        int r = l + len - 1;\n        for (int k = l; k < r; k++)\n            dp[l][r] = best(dp[l][r], dp[l][k] + dp[k + 1][r] + cost(l, k, r));\n    }\n\n// Grid DP with memoized DFS (great for \"longest increasing path\")\nint[][] memo = new int[R][C];   // 0 = not computed yet\nint dfs(int r, int c) {\n    if (memo[r][c] != 0) return memo[r][c];\n    ...\n}\n```\n\n## Pitfalls\n\n- Index shifting: when `dp` has size `n+1`, `dp[i]` corresponds to `a[i-1]`.\n- Loop order: interval DP must iterate **by length**, not by `l`.\n- Counting problems (Coin Change II): putting the coin loop **outside** counts combinations, while putting it inside counts permutations.\n- Space optimisation: if each row depends only on the previous row, keep 1D arrays for the previous and current rows.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 62 | [Unique Paths](https://leetcode.com/problems/unique-paths/) | M | Grid paths |\n| [ ] | 64 | [Minimum Path Sum](https://leetcode.com/problems/minimum-path-sum/) | M | Grid paths |\n| [ ] | 221 | [Maximal Square](https://leetcode.com/problems/maximal-square/) | M | Min of 3 neighbours |\n| [ ] | 1143 | [Longest Common Subsequence](https://leetcode.com/problems/longest-common-subsequence/) | M | Two strings ⭐ |\n| [ ] | 518 | [Coin Change II](https://leetcode.com/problems/coin-change-ii/) | M | Count combinations |\n| [ ] | 494 | [Target Sum](https://leetcode.com/problems/target-sum/) | M | Knapsack / memo |\n| [ ] | 309 | [Best Time to Buy and Sell Stock with Cooldown](https://leetcode.com/problems/best-time-to-buy-and-sell-stock-with-cooldown/) | M | State machine |\n| [ ] | 97 | [Interleaving String](https://leetcode.com/problems/interleaving-string/) | M | Two strings |\n| [ ] | 72 | [Edit Distance](https://leetcode.com/problems/edit-distance/) | M | Two strings ⭐ |\n| [ ] | 329 | [Longest Increasing Path in a Matrix](https://leetcode.com/problems/longest-increasing-path-in-a-matrix/) | H | Memoized DFS |\n| [ ] | 115 | [Distinct Subsequences](https://leetcode.com/problems/distinct-subsequences/) | H | Two strings, counting |\n| [ ] | 312 | [Burst Balloons](https://leetcode.com/problems/burst-balloons/) | H | Interval, last balloon burst |\n| [ ] | 10 | [Regular Expression Matching](https://leetcode.com/problems/regular-expression-matching/) | H | Two strings + `*` |\n\n## My Notes\n\n-\n"}, {"id": "15-Greedy", "file": "15-Greedy.md", "title": "15 · Greedy", "md": "# 15 · Greedy\n\n> **Prereqs:** 01, 09 · **Time:** 3 days\n\n## When to use\n\n- The choice that looks best right now **never needs to be undone**.\n- Sorting by some key makes the next decision obvious.\n- Reachability, or covering a range (\"how far can I get?\").\n- If you can't prove the greedy choice is correct, the problem is probably DP.\n\n## Core concepts\n\n- **Exchange argument**: to prove greedy works, show that swapping any optimal solution's choice for the greedy choice doesn't make the result worse.\n- **Track the furthest reachable point**: Jump Game I and II.\n- **Running balance with a reset**: Gas Station (if the tank goes negative, restart from the next station).\n- **Sort and process in order**: intervals, assigning cookies, hand of straights.\n- **Two passes (left to right, then right to left)**: Candy, Trapping Rain Water.\n- **Range of possibilities**: Valid Parenthesis String (track the minimum and maximum number of open brackets).\n\n## Templates\n\n```java\n// Jump Game: reachability\nint far = 0;\nfor (int i = 0; i < nums.length; i++) {\n    if (i > far) return false;\n    far = Math.max(far, i + nums[i]);\n}\nreturn true;\n\n// Jump Game II: BFS-by-levels\nint jumps = 0, end = 0, far = 0;\nfor (int i = 0; i < nums.length - 1; i++) {\n    far = Math.max(far, i + nums[i]);\n    if (i == end) {\n        jumps++;\n        end = far;\n    }\n}\nreturn jumps;\n\n// Gas Station\nint total = 0, tank = 0, start = 0;\nfor (int i = 0; i < gas.length; i++) {\n    total += gas[i] - cost[i];\n    tank += gas[i] - cost[i];\n    if (tank < 0) {\n        tank = 0;\n        start = i + 1;\n    }\n}\nreturn total < 0 ? -1 : start;\n```\n\n## Pitfalls\n\n- Using a greedy approach when the problem actually needs DP. Coin Change with arbitrary coin values is the classic trap.\n- Sorting by the wrong key.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 455 | [Assign Cookies](https://leetcode.com/problems/assign-cookies/) | E | Sort both lists |\n| [ ] | 122 | [Best Time to Buy and Sell Stock II](https://leetcode.com/problems/best-time-to-buy-and-sell-stock-ii/) | M | Sum the gains |\n| [ ] | 55 | [Jump Game](https://leetcode.com/problems/jump-game/) | M | Furthest reach |\n| [ ] | 45 | [Jump Game II](https://leetcode.com/problems/jump-game-ii/) | M | BFS by levels |\n| [ ] | 134 | [Gas Station](https://leetcode.com/problems/gas-station/) | M | Running balance |\n| [ ] | 846 | [Hand of Straights](https://leetcode.com/problems/hand-of-straights/) | M | Sort + counts |\n| [ ] | 1899 | [Merge Triplets to Form Target Triplet](https://leetcode.com/problems/merge-triplets-to-form-target-triplet/) | M | Filter |\n| [ ] | 763 | [Partition Labels](https://leetcode.com/problems/partition-labels/) | M | Last occurrence of each character |\n| [ ] | 678 | [Valid Parenthesis String](https://leetcode.com/problems/valid-parenthesis-string/) | M | Min/max open count |\n| [ ] | 135 | [Candy](https://leetcode.com/problems/candy/) | H | Two passes |\n\n## My Notes\n\n-\n"}, {"id": "16-Intervals", "file": "16-Intervals.md", "title": "16 · Intervals", "md": "# 16 · Intervals\n\n> **Prereqs:** 09, 15 · **Time:** 2 days\n\n## When to use\n\n- The input is a list of `[start, end]` pairs: meetings, bookings, ranges.\n- Merging, inserting, counting overlaps, or finding the minimum number of rooms or arrows.\n\n## Core concepts\n\n- Two intervals overlap if `a.start <= b.end and b.start <= a.end`. Check whether the boundaries are inclusive.\n- **Sort by start** for merging and inserting.\n- **Sort by end** for \"the most non-overlapping intervals\" or \"the fewest arrows\". This is the classic activity-selection greedy.\n- **Minimum number of rooms**: use a min-heap of end times, or a **sweep line** (+1 at each start, −1 at each end, sorted).\n- Intersecting two sorted lists: use two pointers and advance whichever interval ends first.\n\n## Templates\n\n```java\n// Merge\nArrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));\nList<int[]> res = new ArrayList<>();\nfor (int[] cur : intervals) {\n    int[] last = res.isEmpty() ? null : res.get(res.size() - 1);\n    if (last != null && cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);\n    else res.add(cur);\n}\nreturn res.toArray(new int[0][]);\n\n// Max non-overlapping (activity selection)\nArrays.sort(intervals, (a, b) -> Integer.compare(a[1], b[1]));\nint count = 0;\nlong end = Long.MIN_VALUE;\nfor (int[] iv : intervals)\n    if (iv[0] >= end) {\n        count++;\n        end = iv[1];\n    }\n\n// Meeting rooms II: heap of end times\nArrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));\nPriorityQueue<Integer> h = new PriorityQueue<>();\nfor (int[] iv : intervals) {\n    if (!h.isEmpty() && h.peek() <= iv[0]) h.poll();\n    h.offer(iv[1]);\n}\nreturn h.size();\n```\n\n## Pitfalls\n\n- Whether touching intervals like `[1,2]` and `[2,3]` count as overlapping depends on the problem. Read it carefully.\n- Sorting by start when the greedy approach needs sorting by end.\n- Sorting with `(a, b) -> a[0] - b[0]`. It overflows when values span the full `int` range (Minimum Number of Arrows has exactly this test). Use `Integer.compare`.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 252 | [Meeting Rooms](https://leetcode.com/problems/meeting-rooms/) 🔒 | E | Sort + check neighbours |\n| [ ] | 56 | [Merge Intervals](https://leetcode.com/problems/merge-intervals/) | M | Sort by start ⭐ |\n| [ ] | 57 | [Insert Interval](https://leetcode.com/problems/insert-interval/) | M | Three phases |\n| [ ] | 435 | [Non-overlapping Intervals](https://leetcode.com/problems/non-overlapping-intervals/) | M | Sort by end |\n| [ ] | 452 | [Minimum Number of Arrows to Burst Balloons](https://leetcode.com/problems/minimum-number-of-arrows-to-burst-balloons/) | M | Sort by end |\n| [ ] | 986 | [Interval List Intersections](https://leetcode.com/problems/interval-list-intersections/) | M | Two pointers |\n| [ ] | 253 | [Meeting Rooms II](https://leetcode.com/problems/meeting-rooms-ii/) 🔒 | M | Heap / sweep line ⭐ |\n| [ ] | 1851 | [Minimum Interval to Include Each Query](https://leetcode.com/problems/minimum-interval-to-include-each-query/) | H | Sort queries + heap |\n\n## My Notes\n\n-\n"}, {"id": "17-Math-and-Geometry", "file": "17-Math-and-Geometry.md", "title": "17 · Math & Geometry", "md": "# 17 · Math & Geometry\n\n> **Prereqs:** 01 · **Time:** 2 days\n\n## When to use\n\n- Matrix manipulation: rotating, spiral traversal, in-place marking.\n- Digit manipulation, overflow, modular arithmetic.\n- Primes, GCD, fast exponentiation.\n- Points, lines and squares on a 2D plane.\n\n## Core concepts\n\n- **Rotate a matrix 90° clockwise** = transpose it, then reverse each row.\n- **Spiral order**: shrink the four boundaries (top, bottom, left, right).\n- **In-place marking**: use the first row and first column as flags (Set Matrix Zeroes).\n- **Fast power**: `x^n` by repeated squaring takes O(log n). Handle negative n.\n- **GCD**: `gcd(a, b) = gcd(b, a % b)`. Use it to store a reduced slope `(dy/g, dx/g)` as a hash key (Max Points on a Line).\n- **Sieve of Eratosthenes** finds all primes up to n in O(n log log n).\n- **Cycle detection on numbers**: use a set or Floyd's algorithm (Happy Number).\n- **Modulo** `1_000_000_007`: apply the modulo after every addition or multiplication, and multiply as `long`: `(long) a * b % MOD`.\n- Java's `%` keeps the sign of the left operand, so `-7 % 3 == -1`. Use `((a % m) + m) % m` for a non-negative result.\n- Watch for 32-bit `int` **overflow**: use `long` for products and large sums. `Math.addExact` / `Math.multiplyExact` throw instead of silently wrapping.\n\n## Templates\n\n```java\n// Rotate image\nint n = m.length;\nfor (int i = 0; i < n; i++)\n    for (int j = i + 1; j < n; j++) {\n        int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;\n    }\nfor (int[] row : m)\n    for (int l = 0, r = n - 1; l < r; l++, r--) {\n        int t = row[l]; row[l] = row[r]; row[r] = t;\n    }\n\n// Fast power\ndouble power(double x, long n) {   // long: negating Integer.MIN_VALUE overflows int\n    if (n < 0) { x = 1 / x; n = -n; }\n    double res = 1;\n    while (n > 0) {\n        if ((n & 1) == 1) res *= x;\n        x *= x;\n        n >>= 1;\n    }\n    return res;\n}\n\n// Sieve\nboolean[] isPrime = new boolean[n + 1];\nfor (int i = 2; i <= n; i++) isPrime[i] = true;\nfor (int i = 2; (long) i * i <= n; i++)\n    if (isPrime[i])\n        for (int j = i * i; j <= n; j += i) isPrime[j] = false;\n```\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 66 | [Plus One](https://leetcode.com/problems/plus-one/) | E | Carry |\n| [ ] | 202 | [Happy Number](https://leetcode.com/problems/happy-number/) | E | Cycle detection |\n| [ ] | 48 | [Rotate Image](https://leetcode.com/problems/rotate-image/) | M | Transpose + reverse ⭐ |\n| [ ] | 54 | [Spiral Matrix](https://leetcode.com/problems/spiral-matrix/) | M | Shrinking boundaries ⭐ |\n| [ ] | 73 | [Set Matrix Zeroes](https://leetcode.com/problems/set-matrix-zeroes/) | M | In-place markers |\n| [ ] | 50 | [Pow(x, n)](https://leetcode.com/problems/powx-n/) | M | Fast power |\n| [ ] | 43 | [Multiply Strings](https://leetcode.com/problems/multiply-strings/) | M | Grade-school multiplication |\n| [ ] | 204 | [Count Primes](https://leetcode.com/problems/count-primes/) | M | Sieve |\n| [ ] | 2013 | [Detect Squares](https://leetcode.com/problems/detect-squares/) | M | Diagonal-point counting |\n| [ ] | 149 | [Max Points on a Line](https://leetcode.com/problems/max-points-on-a-line/) | H | GCD slope key |\n\n## My Notes\n\n-\n"}, {"id": "18-Bit-Manipulation", "file": "18-Bit-Manipulation.md", "title": "18 · Bit Manipulation", "md": "# 18 · Bit Manipulation\n\n> **Prereqs:** none · **Time:** 1–2 days\n\n## When to use\n\n- \"Every element appears twice except one\" (XOR).\n- O(1) space is required for counting or finding elements.\n- Representing subsets compactly (bitmask DP, n ≤ 20).\n- Arithmetic without using `+` or `*`.\n\n## Core tricks\n\n| Trick | Expression |\n|-------|-----------|\n| XOR cancels pairs | `a ^ a = 0`, `a ^ 0 = a` |\n| Check bit i | `(x >> i) & 1` |\n| Set / clear / toggle bit i | `x \\| (1<<i)`, `x & ~(1<<i)`, `x ^ (1<<i)` |\n| Clear lowest set bit | `x & (x - 1)` |\n| Isolate lowest set bit | `x & -x` |\n| Power of two? | `x > 0 && (x & (x - 1)) == 0` |\n| Count set bits | `Integer.bitCount(x)` or Kernighan's loop |\n| Iterate all subsets of n items | `for (int mask = 0; mask < (1 << n); mask++)` |\n| Counting bits DP | `bits[i] = bits[i >> 1] + (i & 1)` |\n\n## Java gotchas\n\n- `int` is 32-bit two's complement and overflow wraps silently. Use `long` and `1L << i` when you need bit 31 or higher.\n- `>>` is an arithmetic shift (copies the sign bit). `>>>` is a logical shift (fills with 0). Use `>>>` when treating an `int` as unsigned, as in Number of 1 Bits and Reverse Bits.\n- `==` binds tighter than `&`, `|` and `^`. Write `(x & 1) == 1`. Without the parentheses it doesn't compile.\n- Shift counts are taken mod 32 (mod 64 for `long`), so `1 << 32 == 1`.\n- Because `int` already wraps at 32 bits, Sum of Two Integers needs no masking in Java.\n\n## Templates\n\n```java\n// Single number\nint res = 0;\nfor (int x : nums) res ^= x;\n\n// Kernighan popcount\nint cnt = 0;\nwhile (x != 0) {\n    x &= x - 1;\n    cnt++;\n}\n\n// Sum without + (int wraps at 32 bits, so negatives just work)\nwhile (b != 0) {\n    int carry = (a & b) << 1;\n    a ^= b;\n    b = carry;\n}\nreturn a;\n```\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 136 | [Single Number](https://leetcode.com/problems/single-number/) | E | XOR |\n| [ ] | 191 | [Number of 1 Bits](https://leetcode.com/problems/number-of-1-bits/) | E | Kernighan |\n| [ ] | 338 | [Counting Bits](https://leetcode.com/problems/counting-bits/) | E | DP on bits |\n| [ ] | 190 | [Reverse Bits](https://leetcode.com/problems/reverse-bits/) | E | Shift and build |\n| [ ] | 268 | [Missing Number](https://leetcode.com/problems/missing-number/) | E | XOR with indices |\n| [ ] | 371 | [Sum of Two Integers](https://leetcode.com/problems/sum-of-two-integers/) | M | XOR + carry |\n| [ ] | 7 | [Reverse Integer](https://leetcode.com/problems/reverse-integer/) | M | Overflow check |\n| [ ] | 137 | [Single Number II](https://leetcode.com/problems/single-number-ii/) | M | Count each bit mod 3 |\n| [ ] | 260 | [Single Number III](https://leetcode.com/problems/single-number-iii/) | M | Split on the lowest set bit |\n| [ ] | 201 | [Bitwise AND of Numbers Range](https://leetcode.com/problems/bitwise-and-of-numbers-range/) | M | Common prefix |\n\n## My Notes\n\n-\n"}, {"id": "19-Advanced-Optional", "file": "19-Advanced-Optional.md", "title": "19 · Advanced (Optional)", "md": "# 19 · Advanced (Optional)\n\n> Do this topic only after 00–18 feel solid. These come up rarely in typical SDE interviews, mostly at Google or in hard rounds. Knowing they **exist** and when to mention them is usually enough.\n\n## Topics\n\n### Segment Tree / Fenwick Tree (BIT)\n- **When:** range queries (sum, min or max) combined with **point updates**, each in O(log n).\n- A Fenwick tree is shorter to write and handles prefix sums. A segment tree is more flexible and can support lazy propagation for range updates.\n\n```java\nclass BIT {\n    int[] t;\n    BIT(int n) { t = new int[n + 1]; }\n    void update(int i, int d) {      // 1-indexed\n        for (; i < t.length; i += i & -i) t[i] += d;\n    }\n    int query(int i) {               // prefix sum [1..i]\n        int s = 0;\n        for (; i > 0; i -= i & -i) s += t[i];\n        return s;\n    }\n}\n```\n\n### String matching: KMP / Rabin-Karp / Z-function\n- **When:** finding a pattern inside a text in O(n + m), or finding the longest prefix that is also a suffix.\n- The KMP failure function (LPS array) is the most important part to learn.\n\n### Monotonic queue DP, bitmask DP, digit DP\n- **Bitmask DP:** `dp[mask][i]` for small n (≤ 20), as in the travelling salesman problem or \"visit all nodes\".\n\n### Topological sort + DP on DAGs, Strongly Connected Components (Kosaraju or Tarjan)\n\n### Ordered sets\n- In Java, `TreeSet` / `TreeMap` give O(log n) insert, delete, `floor`, `ceiling`, `lower` and `higher`. They don't support rank queries (the index of an element), so use a BIT or segment tree for those.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 28 | [Find the Index of the First Occurrence in a String](https://leetcode.com/problems/find-the-index-of-the-first-occurrence-in-a-string/) | E | KMP |\n| [ ] | 307 | [Range Sum Query - Mutable](https://leetcode.com/problems/range-sum-query-mutable/) | M | BIT / segment tree |\n| [ ] | 847 | [Shortest Path Visiting All Nodes](https://leetcode.com/problems/shortest-path-visiting-all-nodes/) | H | BFS + bitmask |\n| [ ] | 315 | [Count of Smaller Numbers After Self](https://leetcode.com/problems/count-of-smaller-numbers-after-self/) | H | BIT / merge sort |\n| [ ] | 214 | [Shortest Palindrome](https://leetcode.com/problems/shortest-palindrome/) | H | KMP |\n\n## My Notes\n\n-\n"}], "readme": "# DSA Prep\n\nTopic-wise prep. In each file, read the concepts and templates first, then solve the problems in order (Easy, then Medium, then Hard).\nTemplates are in Java, written with the standard library (`HashMap`, `ArrayDeque`, `PriorityQueue`, `TreeMap`) the way you'd write them in an interview. The Pitfalls sections include Java-specific traps such as `int` overflow, `Integer` comparison and comparator overflow.\n\n## Revision site\n\n**Start it with the chat panel (recommended):**\n\n```bash\ncd ~/Projects/Resume/Preparation/DSA\npython3 serve.py        # opens http://localhost:8765. Press Ctrl+C to stop.\n```\n\nClick **💬 Ask Claude** (bottom right) to ask questions, get hints, or have Claude update your plan and notes. Claude can see which page you're on and your progress. It runs as Claude Code in this folder and can edit the `.md` files, but it can't run shell commands. When it changes a file, the site rebuilds and the page reloads automatically.\n\nYou can also just open `index.html` directly, without the chat. In that case, **after editing any `.md`, run `python3 build.py`** and refresh the page.\n\n- **Dashboard:** overall progress, activity heatmap, the next problems to do.\n- **Topic pages:** the notes plus a problem table. Log each attempt as ✓ (solved on my own), ~ (needed a hint) or ✗ (couldn't solve).\n- **Revise:** problems that are due for a re-solve (spaced repetition), plus three flashcard decks: **Pattern drill** (problem → approach), **Spot the technique** (signal → topic) and **Template recall**.\n- **Problems:** every problem in one place, filterable. **Templates:** a one-page cheat sheet of all the templates.\n- **Hide patterns** blurs the pattern column so it doesn't give the answer away.\n\nProgress is saved in your browser. Use **Export** to back it up, and **Import** to restore it. The browser treats `http://localhost:8765` and the plain `index.html` file as separate sites, so each keeps its own progress. Pick one and stick with it, or move progress across with Export and Import.\n\n## How to use each topic file\n\n1. **Read** the \"When to use\" and \"Core concepts\" sections.\n2. **Type out the templates** from memory. Don't just read them.\n3. **Solve the problems**: try each one for 25–30 minutes before looking at hints. Tick `[x]` when you can solve it on your own.\n4. **Write notes** in \"My Notes\": what tripped you up, edge cases, and the key insight in one line.\n5. **Revisit** the problems you couldn't solve after 3 days, then 7, then 21.\n\n## Roadmap (suggested order)\n\nEach phase depends on the ones before it. Do them in order.\n\n| # | Topic | Phase | Status |\n|---|-------|-------|--------|\n| 00 | [Complexity Analysis](00-Complexity-Analysis.md) | Foundations | ⬜ |\n| 01 | [Arrays & Hashing](01-Arrays-and-Hashing.md) | Foundations | ⬜ |\n| 02 | [Two Pointers](02-Two-Pointers.md) | Linear | ⬜ |\n| 03 | [Sliding Window](03-Sliding-Window.md) | Linear | ⬜ |\n| 04 | [Stack & Monotonic Stack](04-Stack.md) | Linear | ⬜ |\n| 05 | [Binary Search](05-Binary-Search.md) | Linear | ⬜ |\n| 06 | [Linked List](06-Linked-List.md) | Linear | ⬜ |\n| 07 | [Trees](07-Trees.md) | Non-linear | ⬜ |\n| 08 | [Tries](08-Tries.md) | Non-linear | ⬜ |\n| 09 | [Heaps / Priority Queue](09-Heaps.md) | Non-linear | ⬜ |\n| 10 | [Backtracking](10-Backtracking.md) | Recursion | ⬜ |\n| 11 | [Graphs](11-Graphs.md) | Graphs | ⬜ |\n| 12 | [Advanced Graphs](12-Advanced-Graphs.md) | Graphs | ⬜ |\n| 13 | [Dynamic Programming: 1D](13-DP-1D.md) | DP | ⬜ |\n| 14 | [Dynamic Programming: 2D](14-DP-2D.md) | DP | ⬜ |\n| 15 | [Greedy](15-Greedy.md) | Misc | ⬜ |\n| 16 | [Intervals](16-Intervals.md) | Misc | ⬜ |\n| 17 | [Math & Geometry](17-Math-and-Geometry.md) | Misc | ⬜ |\n| 18 | [Bit Manipulation](18-Bit-Manipulation.md) | Misc | ⬜ |\n| 19 | [Advanced (Optional)](19-Advanced-Optional.md) | Stretch | ⬜ |\n\nStatus key: ⬜ not started · 🟨 in progress · ✅ done · 🔁 needs revision\n\n## Pacing (about 10 weeks at 2–3 problems a day)\n\n| Weeks | Topics |\n|-------|--------|\n| 1 | 00–03 |\n| 2 | 04–06 |\n| 3 | 07–09 |\n| 4 | 10 |\n| 5 | 11–12 |\n| 6–7 | 13–14 |\n| 8 | 15–19 |\n| 9–10 | Mixed revision, company-tagged problems, mock interviews |\n\n## Interview loop checklist (use on every problem)\n\n1. Restate the problem and confirm the input/output format.\n2. Ask about constraints: size of n, value range, duplicates, negatives, empty input.\n3. Work through a small example by hand.\n4. Describe the brute-force solution and its complexity.\n5. Optimise it, naming the pattern you're using.\n6. Code it while talking through what you're doing.\n7. Dry-run your code on the example, then on edge cases.\n8. State the final time and space complexity.\n\n## Revision log\n\n| Date | Problem | Topic | Result (Solved / Hint / Failed) | Revisit on |\n|------|---------|-------|----------------------------------|------------|\n| | | | | |\n"};
const LS_KEY = 'dsa-prep-v1';
const INTERVALS = [1, 3, 7, 21, 45, 90];

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => dateStr(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dateStr(d); };
const dayDiff = s => Math.round((Date.parse(s) - Date.parse(today())) / 86400000);
const relDay = s => { const n = dayDiff(s); return n <= 0 ? '<b>due</b>' : n === 1 ? 'tomorrow' : 'in ' + n + 'd'; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const md = s => window.marked ? marked.parse(s) : '<pre>' + esc(s) + '</pre>';
const DIFF = { E: 'Easy', M: 'Medium', H: 'Hard' };

/* ---------- state ---------- */
function load() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
let state = load();
function norm() { state.problems ||= {}; state.cards ||= {}; state.activity ||= {}; state.settings ||= {}; }
norm();
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function bump() { const t = today(); state.activity[t] = (state.activity[t] || 0) + 1; }

/* ---------- parse markdown data ---------- */
const PROB_RE = /^\|\s*\[( |x|X)\]\s*\|\s*(\d+)\s*\|\s*\[([^\]]+)\]\(([^)]+)\)\s*(🔒)?\s*\|\s*([EMH])\s*\|\s*(.*?)\s*\|\s*$/u;
function sections(text) {
  const out = {};
  text.split(/^## /m).slice(1).forEach(p => { const nl = p.indexOf('\n'); out[p.slice(0, nl).trim()] = p.slice(nl + 1); });
  return out;
}
const TOPICS = DATA.topics.map(t => {
  const m = t.title.match(/^(\d+)\s*·\s*(.*)$/);
  const topic = { ...t, num: m ? m[1] : '', name: m ? m[2] : t.title, problems: [], sections: sections(t.md) };
  const seenNums = new Set();
  t.md.split('\n').forEach(line => {
    const r = line.match(PROB_RE);
    if (!r || seenNums.has(+r[2])) return;
    seenNums.add(+r[2]);
    topic.problems.push({
      num: +r[2], title: r[3], url: r[4], premium: !!r[5], diff: r[6],
      pattern: r[7].replace('⭐', '').trim(), star: r[7].includes('⭐'),
      mdDone: r[1].toLowerCase() === 'x', topic: t.id,
    });
  });
  return topic;
});
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const ALL = [...new Map(TOPICS.flatMap(t => t.problems).map(p => [p.num, p])).values()];

/* ---------- problem status ---------- */
const pst = p => state.problems[p.num];
const isSolved = p => { const s = pst(p); return !!(s && s.history.some(h => h.r === 'solved')) || p.mdDone; };
const lastResult = p => { const s = pst(p); return s && s.history.length ? s.history[s.history.length - 1].r : (p.mdDone ? 'solved' : null); };
const isDue = p => { const s = pst(p); return !!(s && s.next && s.next <= today()); };
function logAttempt(num, r) {
  const s = state.problems[num] ||= { history: [], stage: 0 };
  s.history.push({ d: today(), r });
  if (r === 'solved') { s.stage = Math.min((s.stage || 0) + 1, INTERVALS.length - 1); s.next = addDays(INTERVALS[s.stage]); }
  else if (r === 'hint') { s.stage = 0; s.next = addDays(2); }
  else { s.stage = 0; s.next = addDays(1); }
  bump();
}
function topicStats(t) {
  const solved = t.problems.filter(isSolved).length, total = t.problems.length;
  return { solved, total, pct: total ? Math.round(solved / total * 100) : 0, status: solved === 0 ? 'todo' : solved === total ? 'done' : 'prog' };
}
function streak() {
  let n = 0; const d = new Date();
  if (!(state.activity[dateStr(d)] > 0)) d.setDate(d.getDate() - 1);
  while (state.activity[dateStr(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- shared renderers ---------- */
const statusDot = r => '<span class="dot ' + (r || '') + '" title="' + (r ? 'Last: ' + r : 'Not attempted') + '"></span>';
function probRow(p, showTopic) {
  const s = pst(p), lr = lastResult(p), hide = state.settings.hidePatterns;
  return '<tr data-num="' + p.num + '" class="r-' + (lr || 'none') + '">' +

    '<td class="meta">' + (s && s.history.length ? s.history.length + '× · next ' + relDay(s.next) : (p.mdDone ? 'ticked in .md' : '—')) + '</td>' +

}
function probTable(list, showTopic) {
  if (!list.length) return '<div class="panel empty">No problems match.</div>';

}
const legend = '<div class="legend"><span>✓ solved on my own</span><span>~ needed a hint</span><span>✗ couldn\'t solve</span><span>Revisits: ✓ → 3, 7, 21, 45, 90 days · ~ → 2 days · ✗ → tomorrow</span></div>';

/* ---------- views ---------- */
function viewDashboard() {
  const total = ALL.length, solved = ALL.filter(isSolved).length, due = ALL.filter(isDue).length;
  const week = Object.entries(state.activity).filter(([d]) => dayDiff(d) > -7).reduce((a, [, n]) => a + n, 0);
  const byDiff = ['E', 'M', 'H'].map(d => { const ps = ALL.filter(p => p.diff === d); return { d, t: ps.length, s: ps.filter(isSolved).length }; });
  const nextUp = ALL.filter(p => !isSolved(p) && !pst(p)).slice(0, 6);

      '<div class="panel stat"><div class="v">' + solved + '<span class="muted" style="font-size:16px">/' + total + '</span></div><div class="l">Problems solved</div><div class="bar" style="margin-top:10px"><i style="width:' + (solved / total * 100) + '%"></i></div></div>' +
      '<div class="panel stat"><div class="v">' + due + '</div><div class="l">Due for revision</div>' + (due ? '<a href="#/revise/due/all" style="font-size:13px">Review now →</a>' : '') + '</div>' +
      '<div class="panel stat"><div class="v">' + streak() + '</div><div class="l">Day streak</div></div>' +
      '<div class="panel stat"><div class="v">' + week + '</div><div class="l">Reviews in last 7 days</div></div>' +
    '</div>' +
    '<div class="grid two">' +

        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn primary" href="#/revise/pattern/all">Pattern drill</a><a class="btn" href="#/revise/template/all">Template recall</a></div></div>' +

          (s.total ? '<div class="bar"><i style="width:' + s.pct + '%"></i></div><div class="tc-foot"><span>' + s.solved + '/' + s.total + ' solved</span>' +
          '<span class="pill ' + s.status + '">' + { todo: 'Not started', prog: 'In progress', done: 'Done' }[s.status] + '</span></div>'

// Every markdown table that contains problem rows becomes an interactive table in place.
function topicBody(t) {
  const lines = t.md.split('\n').slice(1), out = [];
  for (let i = 0; i < lines.length;) {
    if (!lines[i].trim().startsWith('|')) { out.push(lines[i++]); continue; }
    const block = [];
    while (i < lines.length && lines[i].trim().startsWith('|')) block.push(lines[i++]);
    const nums = block.map(l => l.match(PROB_RE)).filter(Boolean).map(r => r[2]);
    if (nums.length) out.push('', '<div class="prob-slot" data-nums="' + nums.join(',') + '"></div>', '');
    else out.push(...block);
  }
  return out.join('\n');
}
function viewTopic(id) {
  const t = topicById[id];
  if (!t) return '<div class="empty">Topic not found.</div>';
  const s = topicStats(t), i = TOPICS.indexOf(t), prev = TOPICS[i - 1], next = TOPICS[i + 1];
  return '<div class="topic-head"><div><div class="eyebrow">Topic ' + t.num + '</div><h1 class="page">' + esc(t.name) + '</h1></div>' +
      '<div class="actions">' + (t.problems.length ? '<a class="btn" href="#/revise/pattern/' + t.id + '">Pattern drill</a>' : '') +
      '<a class="btn" href="#/revise/template/' + t.id + '">Template recall</a></div></div>' +
    (t.problems.length ? '<div class="topic-prog"><div class="bar"><i style="width:' + s.pct + '%"></i></div>' + s.solved + ' / ' + s.total + ' solved</div>' : '') +
    '<article class="prose">' + md(topicBody(t)) + '</article>' +
    '<div class="pager">' + (prev ? '<a href="#/topic/' + prev.id + '"><small>← Previous</small>' + esc(prev.name) + '</a>' : '<span></span>') +
      (next ? '<a class="next" href="#/topic/' + next.id + '"><small>Next →</small>' + esc(next.name) + '</a>' : '<span></span>') + '</div>';
}
function afterTopic(id) {
  const t = topicById[id];
  if (!t) return;
  const byNum = Object.fromEntries(t.problems.map(p => [p.num, p]));
  document.querySelectorAll('.prob-slot').forEach((slot, i) => {
    const list = [...new Set(slot.dataset.nums.split(','))].map(n => byNum[n]).filter(Boolean);
    slot.outerHTML = (i === 0 ? legend : '') + probTable(list, false);

}

let PF = { q: '', topic: 'all', diff: 'all', status: 'all', star: false };

      '<select id="pf-diff">' + opt('all', 'Any difficulty', PF.diff) + opt('E', 'Easy', PF.diff) + opt('M', 'Medium', PF.diff) + opt('H', 'Hard', PF.diff) + '</select>' +
      '<select id="pf-status">' + opt('all', 'Any status', PF.status) + opt('unsolved', 'Not solved yet', PF.status) + opt('due', 'Due for revision', PF.status) + opt('solved', 'Last: solved', PF.status) + opt('hint', 'Last: needed hint', PF.status) + opt('failed', 'Last: failed', PF.status) + '</select>' +
