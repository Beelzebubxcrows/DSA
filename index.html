<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg:#f6f6f3; --panel:#ffffff; --panel-2:#efefea; --text:#1c1c1f; --muted:#6b6b72; --border:#e2e2dc;
  --accent:#4f46e5; --accent-soft:#ecebff; --accent-text:#ffffff;
  --easy:#15803d; --med:#b45309; --hard:#b91c1c;
  --ok-bg:#dcfce7; --hint-bg:#fef3c7; --fail-bg:#fee2e2;
  --code-bg:#f3f3ef; --heat-0:#e8e8e2; --heat-1:#c7c4ff; --heat-2:#9f9aff; --heat-3:#6e66f0; --heat-4:#4338ca;
  --tok-kw:#7c3aed; --tok-str:#15803d; --tok-com:#8a8a90; --tok-num:#c2410c; --tok-fn:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --text:#e7e7ea; --muted:#9a9aa6; --border:#2a2f3a;
    --accent:#8b8cff; --accent-soft:#25274a; --accent-text:#0f1115;
    --easy:#4ade80; --med:#fbbf24; --hard:#f87171;
    --ok-bg:#143620; --hint-bg:#3a2e0e; --fail-bg:#3d1717;
    --code-bg:#12151b; --heat-0:#1f232c; --heat-1:#2e3170; --heat-2:#4247a8; --heat-3:#6366f1; --heat-4:#a5a6ff;
    --tok-kw:#c4a7ff; --tok-str:#86efac; --tok-com:#6b7280; --tok-num:#fdba74; --tok-fn:#93c5fd;
    --shadow:none;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --text:#e7e7ea; --muted:#9a9aa6; --border:#2a2f3a;
  --accent:#8b8cff; --accent-soft:#25274a; --accent-text:#0f1115;
  --easy:#4ade80; --med:#fbbf24; --hard:#f87171;
  --ok-bg:#143620; --hint-bg:#3a2e0e; --fail-bg:#3d1717;
  --code-bg:#12151b; --heat-0:#1f232c; --heat-1:#2e3170; --heat-2:#4247a8; --heat-3:#6366f1; --heat-4:#a5a6ff;
  --tok-kw:#c4a7ff; --tok-str:#86efac; --tok-com:#6b7280; --tok-num:#fdba74; --tok-fn:#93c5fd;
  --shadow:none;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--text); font:15px/1.6 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
button { font:inherit; color:inherit; cursor:pointer; }
code, pre { font-family:"JetBrains Mono", ui-monospace, Menlo, monospace; }

/* Layout */
.layout { display:grid; grid-template-columns:268px minmax(0,1fr); min-height:100vh; }
.sidebar { position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; gap:18px; }
.main { padding:32px 40px 80px; max-width:1040px; width:100%; min-width:0; }
.brand { font-weight:700; font-size:18px; padding:0 8px; display:flex; align-items:center; gap:8px; }
.brand .logo { width:26px; height:26px; border-radius:7px; background:var(--accent); color:var(--accent-text); display:grid; place-items:center; font-size:13px; }
.nav { display:flex; flex-direction:column; gap:2px; }
.nav a, .topic-link { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; color:var(--text); font-size:14px; }
.nav a:hover, .topic-link:hover { background:var(--panel-2); text-decoration:none; }
.nav a.active, .topic-link.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.badge { margin-left:auto; background:var(--accent); color:var(--accent-text); border-radius:999px; font-size:11px; padding:1px 8px; font-weight:600; }
.side-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:0 10px; margin-bottom:4px; font-weight:600; }
.topic-link { font-size:13.5px; }
.topic-link .tnum { color:var(--muted); font-variant-numeric:tabular-nums; width:18px; flex:none; }
.topic-link .tname { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topic-link .tprog { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.topic-link.done .tprog { color:var(--easy); font-weight:600; }
.side-foot { margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; padding-top:12px; border-top:1px solid var(--border); }
.btn { border:1px solid var(--border); background:var(--panel); border-radius:8px; padding:6px 12px; font-size:13px; }
.btn:hover { background:var(--panel-2); }
.btn.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
.btn.primary:hover { filter:brightness(1.08); }
.btn.sm { padding:4px 9px; font-size:12px; }
.topbar { display:none; }

/* Headings */
.eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
h1.page { font-size:30px; margin:4px 0 6px; letter-spacing:-.02em; }
.sub { color:var(--muted); margin:0 0 24px; }

/* Cards & stats */
.grid { display:grid; gap:14px; }
.stats { grid-template-columns:repeat(4, minmax(0,1fr)); margin-bottom:22px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow); min-width:0; }
.stat .v { font-size:28px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat .l { color:var(--muted); font-size:13px; }
.bar { height:6px; background:var(--panel-2); border-radius:99px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.two { grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); margin-bottom:22px; }
.panel h3 { margin:0 0 12px; font-size:15px; }
.diffrow { display:grid; grid-template-columns:64px minmax(0,1fr) 56px; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
.diffrow .n { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
.topics-grid { grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); }
.tcard { display:block; color:var(--text); }
.tcard:hover { text-decoration:none; border-color:var(--accent); }
.tcard .tc-num { font-size:12px; color:var(--muted); font-weight:600; }
.tcard .tc-name { font-weight:600; margin:2px 0 10px; }
.tcard .tc-foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px; }
.pill { font-size:11px; padding:1px 8px; border-radius:99px; background:var(--panel-2); color:var(--muted); font-weight:600; }
.pill.prog { background:var(--hint-bg); color:var(--med); }
.pill.done { background:var(--ok-bg); color:var(--easy); }

/* Heatmap */
.heat { display:grid; grid-template-rows:repeat(7, 12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; overflow-x:auto; padding-bottom:4px; }
.heat i { border-radius:3px; background:var(--heat-0); }
.heat i.l1 { background:var(--heat-1); } .heat i.l2 { background:var(--heat-2); } .heat i.l3 { background:var(--heat-3); } .heat i.l4 { background:var(--heat-4); }
.heat i.future { background:transparent; }

/* Problem tables */
.tablewrap { overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--panel); }
table.probs { width:100%; border-collapse:collapse; font-size:14px; }
table.probs th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
table.probs td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.probs tr:last-child td { border-bottom:none; }
table.probs tr.r-solved { background:color-mix(in srgb, var(--ok-bg) 45%, transparent); }
table.probs tr.r-hint { background:color-mix(in srgb, var(--hint-bg) 45%, transparent); }
table.probs tr.r-failed { background:color-mix(in srgb, var(--fail-bg) 45%, transparent); }
td.num { color:var(--muted); font-variant-numeric:tabular-nums; width:52px; }
td.meta { color:var(--muted); font-size:12px; white-space:nowrap; }
td.pattern { color:var(--muted); font-size:13px; }
td.pattern.blur { filter:blur(5px); cursor:pointer; user-select:none; transition:filter .15s; }
td.pattern.blur.peek { filter:none; }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; background:var(--border); }
.dot.solved { background:var(--easy); } .dot.hint { background:var(--med); } .dot.failed { background:var(--hard); }
.diff { font-size:12px; font-weight:600; }
.d-E { color:var(--easy); } .d-M { color:var(--med); } .d-H { color:var(--hard); }
.tag { font-size:12px; }
.tag.star { color:var(--med); }
td.acts { white-space:nowrap; text-align:right; }
td.acts button { width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--panel); margin-left:3px; font-size:13px; font-weight:600; }
td.acts button[data-act="solved"]:hover { background:var(--ok-bg); color:var(--easy); border-color:var(--easy); }
td.acts button[data-act="hint"]:hover { background:var(--hint-bg); color:var(--med); border-color:var(--med); }
td.acts button[data-act="failed"]:hover { background:var(--fail-bg); color:var(--hard); border-color:var(--hard); }
td.acts button[data-act="reset"] { color:var(--muted); }
.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--muted); margin:8px 0 10px; }

/* Filters */
.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
input[type=search], select { font:inherit; font-size:14px; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
input[type=search] { flex:1; min-width:180px; }
label.chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }

/* Prose (rendered markdown) */
.prose { min-width:0; }
.prose h1 { display:none; }
.prose h2 { font-size:20px; margin:34px 0 10px; padding-top:6px; letter-spacing:-.01em; }
.prose h3 { font-size:16px; margin:22px 0 8px; }
.prose blockquote { margin:0 0 16px; padding:10px 14px; background:var(--accent-soft); border-radius:10px; color:var(--text); border:none; }
.prose blockquote p { margin:0; }
.prose ul, .prose ol { padding-left:22px; }
.prose li { margin:3px 0; }
.prose :not(pre) > code { background:var(--code-bg); border:1px solid var(--border); padding:1px 5px; border-radius:5px; font-size:.86em; }
.prose pre, .card-back pre { background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow-x:auto; font-size:13px; line-height:1.55; }
.prose pre code { background:none; padding:0; }
.prose img { display:block; max-width:100%; height:auto; margin:16px 0; }
.prose table { border-collapse:collapse; width:100%; font-size:14px; display:block; overflow-x:auto; }
.prose th, .prose td { border:1px solid var(--border); padding:7px 10px; text-align:left; }
.prose th { background:var(--panel-2); font-size:13px; }
.hljs { background:none; color:var(--text); }
.hljs-keyword, .hljs-built_in, .hljs-meta { color:var(--tok-kw); }
.hljs-string { color:var(--tok-str); }
.hljs-comment { color:var(--tok-com); font-style:italic; }
.hljs-number, .hljs-literal { color:var(--tok-num); }
.hljs-title, .hljs-title.function_, .hljs-title.class_ { color:var(--tok-fn); }

.topic-head { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between; margin-bottom:18px; }
.topic-head .actions { display:flex; gap:8px; flex-wrap:wrap; }
.topic-prog { display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted); margin-bottom:22px; }
.topic-prog .bar { flex:1; max-width:340px; }
.pager { display:flex; justify-content:space-between; gap:12px; margin-top:40px; }
.pager a { flex:1; border:1px solid var(--border); border-radius:12px; padding:12px 16px; background:var(--panel); color:var(--text); }
.pager a:hover { border-color:var(--accent); text-decoration:none; }
.pager a small { display:block; color:var(--muted); font-size:12px; }
.pager a.next { text-align:right; }

/* Revise */
.tabs { display:flex; gap:4px; background:var(--panel-2); padding:4px; border-radius:10px; flex-wrap:wrap; }
.tabs a { padding:6px 14px; border-radius:7px; color:var(--muted); font-size:14px; font-weight:500; }
.tabs a:hover { text-decoration:none; color:var(--text); }
.tabs a.active { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
.revbar { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:20px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px; box-shadow:var(--shadow); max-width:760px; }
.card-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:16px; }
.card-label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:600; margin-bottom:8px; }
.card-front { font-size:20px; font-weight:600; line-height:1.45; }
.card-front p { margin:0; }
.card-front .sub2 { font-size:14px; color:var(--muted); font-weight:400; margin-top:6px; }
.card-back { margin-top:20px; padding-top:20px; border-top:1px dashed var(--border); }
.card-back .ans { font-size:18px; font-weight:700; color:var(--accent); }
.card-actions { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
.card-actions .btn { padding:9px 18px; font-size:14px; }
.btn.good { background:var(--ok-bg); color:var(--easy); border-color:transparent; font-weight:600; }
.btn.bad { background:var(--fail-bg); color:var(--hard); border-color:transparent; font-weight:600; }
kbd { font-family:"JetBrains Mono", monospace; font-size:11px; border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:0 5px; margin-left:6px; opacity:.75; }
.empty { text-align:center; padding:40px 20px; color:var(--muted); }
.empty .big { font-size:36px; margin-bottom:6px; }
.nextup li { margin:6px 0; }
.muted { color:var(--muted); }
.section-gap { margin-top:28px; }

/* Chat */
.chat-fab { position:fixed; right:22px; bottom:22px; z-index:25; border:none; border-radius:999px; padding:12px 18px; background:var(--accent); color:var(--accent-text); font-weight:600; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.18); }
.chat-fab:hover { filter:brightness(1.08); }
body.chat-open .chat-fab { display:none; }
.chat { position:fixed; top:0; right:0; z-index:30; width:420px; max-width:100vw; height:100vh; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; box-shadow:-8px 0 40px rgba(0,0,0,.12); }
body.chat-open .chat { transform:none; }
@media (min-width: 1380px) { body.chat-open .layout { margin-right:420px; } }
.chat-head { display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--border); }
.chat-head .t { font-weight:700; flex:1; min-width:0; }
.chat-head .t small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
.chat-log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.msg { max-width:100%; min-width:0; font-size:14px; line-height:1.55; }
.msg.user { align-self:flex-end; background:var(--accent); color:var(--accent-text); padding:9px 13px; border-radius:14px 14px 4px 14px; max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.assistant { background:var(--panel-2); padding:10px 14px; border-radius:14px 14px 14px 4px; }
.msg.assistant p { margin:6px 0; }
.msg.assistant p:first-child { margin-top:0; } .msg.assistant p:last-child { margin-bottom:0; }
.msg.assistant pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow-x:auto; font-size:12.5px; }
.msg.assistant :not(pre) > code { background:var(--code-bg); padding:1px 4px; border-radius:4px; font-size:.88em; }
.msg.assistant table { border-collapse:collapse; font-size:13px; display:block; overflow-x:auto; }
.msg.assistant th, .msg.assistant td { border:1px solid var(--border); padding:4px 8px; }
.msg.assistant ul, .msg.assistant ol { padding-left:20px; margin:6px 0; }
.msg .tool { font-size:12px; color:var(--muted); margin:6px 0; display:flex; gap:6px; align-items:center; }
.msg .err { color:var(--hard); font-size:13px; margin-top:6px; }
.msg .note { color:var(--easy); font-size:12px; margin-top:6px; font-weight:600; }
.typing { display:inline-flex; gap:4px; padding:4px 0; }
.typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }
.chat-form { border-top:1px solid var(--border); padding:12px; display:flex; gap:8px; align-items:flex-end; }
.chat-form textarea { flex:1; min-width:0; resize:none; font:inherit; font-size:14px; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); max-height:160px; }
.chat-form textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
.chips { display:flex; flex-direction:column; gap:6px; }
.chips button { text-align:left; border:1px solid var(--border); background:var(--panel); border-radius:10px; padding:8px 12px; font-size:13px; }
.chips button:hover { border-color:var(--accent); }
.chat-empty { color:var(--muted); font-size:14px; }
.chat-empty pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:12px; white-space:pre-wrap; color:var(--text); }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:14px; z-index:40; }

@media (max-width: 900px) {
  .layout { grid-template-columns:minmax(0,1fr); }
  .sidebar { position:fixed; left:0; top:0; z-index:20; width:280px; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.25); }
  body.nav-open .sidebar { transform:none; }
  .topbar { display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; font-weight:700; }
  .main { padding:20px 16px 60px; }
  .stats { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .two { grid-template-columns:minmax(0,1fr); }
  .card { padding:20px; }
  td.meta, th.meta { display:none; }
}
</style>
</head>
<body>
<div class="topbar"><button class="btn sm" id="menu">☰</button> DSA Prep</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<input type="file" id="importFile" accept="application/json" hidden>
<button class="chat-fab" id="chat-fab">💬 Ask Claude</button>
<aside class="chat" id="chat" aria-label="Chat with Claude">
  <div class="chat-head">
    <div class="t">Ask Claude<small>Ask questions, get hints, or have it update your plan</small></div>
    <button class="btn sm" id="chat-new" title="Start a new conversation">New chat</button>
    <button class="btn sm" id="chat-close" title="Close">✕</button>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <form class="chat-form" id="chat-form">
    <textarea id="chat-input" rows="2" placeholder="Ask anything, or say what to change…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="btn primary" id="chat-send" type="submit">Send</button>
  </form>

const DATA = {"topics": [{"id": "00-Complexity-Analysis", "file": "00-Complexity-Analysis.md", "title": "00 · Complexity Analysis", "md": "# 00 · Complexity Analysis\n\n> **Goal:** be able to state the time and space complexity of any solution right away, and use the constraints to work out which complexity is expected.\n\n## Core concepts\n\n- **Big-O** gives an upper bound on growth. Drop constants and lower-order terms: `O(3n² + n)` becomes `O(n²)`.\n- **Time complexity** counts the dominant operations as the input size grows.\n- **Space complexity** counts the extra memory used, *including the recursion stack*.\n- **Amortized complexity** is the average cost over a sequence of operations. Appending to a dynamic array is amortized `O(1)` even though an occasional resize costs `O(n)`.\n- **Best, average and worst case.** Quicksort is `O(n log n)` on average and `O(n²)` in the worst case. Hash maps are `O(1)` on average and `O(n)` in the worst case.\n\n## Asymptotic notations: O, Ω, Θ, o, ω\n\nAll five notations compare how fast a function `f(n)` (your algorithm's cost) grows against a simpler function `g(n)` (such as `n` or `n²`) **as n gets large**. They ignore constants and small inputs.\n\n### The intuition\n\n| Notation | Name | Meaning | Analogy |\n|----------|------|---------|---------|\n| **O(g)** | Big O | **Upper bound**: grows *no faster* than g | \"Your parcel will arrive within your lifetime.\" It's true, but it only promises a ceiling. |\n| **Ω(g)** | Big Omega | **Lower bound**: grows *at least as fast* as g | \"I'll pay you *at least* one dollar.\" It only promises a floor. |\n| **Θ(g)** | Big Theta | **Tight bound**: both O and Ω, so it grows *exactly like* g | \"Today's high is 25 °C and the low is 19 °C.\" Both ends are pinned down. |\n| **o(g)** | Little o | **Strict upper bound**: grows *strictly slower* than g | A ceiling it never reaches |\n| **ω(g)** | Little omega | **Strict lower bound**: grows *strictly faster* than g | A floor it leaves far behind |\n\nThink of them as comparison operators on growth rates:\n\n| | O | Ω | Θ | o | ω |\n|---|---|---|---|---|---|\n| Like | `≤` | `≥` | `=` | `<` | `>` |\n\nThis explains why Θ means O plus Ω: if `x ≤ y` and `x ≥ y`, then `x = y`.\n\n### The graph\n\n![Big O, Big Omega and Big Theta bounds](images/asymptotic-bounds.svg)\n\n- **n₀** is the point after which the bound has to hold. Before n₀ (small inputs), anything goes. That's why constant factors and start-up costs don't matter.\n- **c** is a constant multiplier you're allowed to choose. So `3n + 100` is still O(n): pick c = 4, and once n ≥ 100, `3n + 100 ≤ 4n`.\n- **Θ** sandwiches f(n) between two multiples of the same g(n) once n is past n₀.\n\n### Formal definitions\n\n| | f(n) is … if … |\n|---|---|\n| **O(g(n))** | there exist c > 0 and n₀ such that `f(n) ≤ c·g(n)` for all n ≥ n₀ |\n| **Ω(g(n))** | there exist c > 0 and n₀ such that `f(n) ≥ c·g(n)` for all n ≥ n₀ |\n| **Θ(g(n))** | f(n) is both O(g(n)) and Ω(g(n)): `c₁·g(n) ≤ f(n) ≤ c₂·g(n)` for all n ≥ n₀ |\n| **o(g(n))** | for **every** c > 0 there is an n₀ such that `f(n) < c·g(n)` for all n ≥ n₀. Equivalently, `f(n)/g(n) → 0`. |\n| **ω(g(n))** | for **every** c > 0 there is an n₀ such that `f(n) > c·g(n)` for all n ≥ n₀. Equivalently, `f(n)/g(n) → ∞`. |\n\n**Big O versus little o:** with Big O you only need *one* constant c to work. Little o has to work for *every* constant c, however small, which is only possible if f grows strictly slower.\n\n| Statement | True? | Why |\n|-----------|-------|-----|\n| `2n = O(n)` | ✅ | It grows like n, and the 2 doesn't matter |\n| `2n = Θ(n)` | ✅ | Bounded above and below by multiples of n |\n| `2n = o(n)` | ❌ | 2n/n → 2, not 0. It grows at the same rate, not slower. |\n| `2n = O(n²)` | ✅ | It's a valid upper bound, just a loose one |\n| `2n = o(n²)` | ✅ | 2n/n² → 0, so it grows strictly slower |\n| `n² = Ω(n)` | ✅ | n² grows at least as fast as n |\n| `n² = ω(n)` | ✅ | n²/n → ∞ |\n| `log n = o(n)`, `n = o(n log n)`, `n² = o(2ⁿ)` | ✅ | Each class in the chart below is little-o of the next |\n\n### Example: when does Θ exist?\n\n```java\nvoid printNums(int[] nums) {           // always touches every element\n    for (int x : nums)\n        System.out.println(x);\n}\n// Θ(n): every input of size n costs exactly ~n, so the upper and lower bounds match.\n\nboolean containsZero(int[] nums) {     // may stop early\n    for (int x : nums)\n        if (x == 0) return true;\n    return false;\n}\n// Best case:  0 is first,    1 step  → Ω(1)\n// Worst case: no 0 at all,   n steps → O(n)\n// No single Θ covers *all* inputs, because the cost depends on the input.\n// But each case on its own has a Θ: best case Θ(1), worst case Θ(n).\n```\n\n### ⚠️ Common confusion: \"Big O = worst case\"\n\nThey're **different things**:\n- **Best, average and worst case** say *which inputs* you're analysing.\n- **O, Ω and Θ** say *how tightly* you're bounding the cost for those inputs.\n\nYou can combine them freely. For example, quicksort's worst case is Θ(n²) and its average case is Θ(n log n).\n\n**In interviews**, people say \"O\" but mean the **tightest** bound, which is really Θ. Saying binary search is O(n²) is technically true, but it's a useless answer. Always give the tightest bound you can, and say which case it's for if it matters (\"O(1) on average, O(n) in the worst case\").\n\n## Common complexities (fastest to slowest)\n\n![Growth rates of common complexities](images/growth-rates.svg)\n\n| Complexity | Typical source |\n|------------|----------------|\n| O(1) | Hash lookup, array index |\n| O(log n) | Binary search, operations on a balanced tree or heap |\n| O(n) | Single pass over the input |\n| O(n log n) | Sorting, n heap operations |\n| O(n²) | Nested loops, 2D DP over n×n |\n| O(2ⁿ) | Subsets, naive recursion |\n| O(n!) | Permutations |\n\n## Constraint → target complexity (very useful)\n\nA computer does roughly 10⁸ simple operations per second. Use n to work out which approach is expected:\n\n| n up to | Target | Likely approach |\n|---------|--------|-----------------|\n| ≤ 10–12 | O(n!) | Permutations, brute force |\n| ≤ 20–25 | O(2ⁿ) | Subsets, bitmask, backtracking |\n| ≤ 500 | O(n³) | Interval DP, Floyd–Warshall |\n| ≤ 5,000 | O(n²) | 2D DP, nested loops |\n| ≤ 10⁵ – 10⁶ | O(n log n) / O(n) | Sort, heap, binary search, two pointers, hashing |\n| ≥ 10⁹ | O(log n) / O(1) | Binary search on the answer, math |\n\n## Recursion complexity\n\n- **Time** = (number of calls) × (work per call). For a recursion tree, multiply the branching factor raised to the depth by the work done at each node.\n- **Space** = maximum recursion depth plus any extra structures.\n\n### Why branching factor b and depth d give O(bᵈ)\n\nEach call makes **b** more calls, so the number of calls multiplies by b at every level:\n\n```\nlevel 0:                 f(n)                          1 call   = b⁰\n                    /     |     \\\nlevel 1:         f()     f()    f()                    b calls  = b¹\n                / | \\   / | \\   / | \\\nlevel 2:       ...  each makes b more ...              b² calls\n  ⋮\nlevel d:                                               bᵈ calls\n```\n\n**Total calls** = b⁰ + b¹ + b² + … + bᵈ. That's a geometric series:\n\n```\n1 + b + b² + … + bᵈ  =  (bᵈ⁺¹ − 1) / (b − 1)\n```\n\nFor b ≥ 2, this is **less than 2·bᵈ**. The last level alone is bigger than all the levels above it combined (for b = 2: 1 + 2 + 4 = 7 < 8). Drop the constant and you get **O(bᵈ) calls**.\n\nMultiply by the work per call: **Time = O(bᵈ × work per call)**.\n\n| b (branches) | d (depth) | Calls | Example |\n|--------------|-----------|-------|---------|\n| 1 | n | 1 + 1 + … + 1 = n + 1 → **O(n)** | Linear recursion: factorial, linked-list recursion |\n| 2 | n | ~2ⁿ⁺¹ → **O(2ⁿ)** | Naive Fibonacci, subsets (include or skip) |\n| 3 | n | ~3ⁿ → **O(3ⁿ)** | Three choices per step |\n| 4 | L | ~4ᴸ → **O(4ᴸ)** | Word Search: 4 directions per letter (really 3 after the first, since you can't go back) |\n| n, n−1, n−2, … | n | n! → **O(n!)** | Permutations: the branching shrinks by one each level |\n\nNotes:\n- **This is an upper bound (O), not always tight (Θ).** In Fibonacci the two branches have different depths (n−1 and n−2), so the tree is lopsided. The true count is about 1.618ⁿ. O(2ⁿ) is still correct and is the expected answer in interviews.\n- **Memoization collapses the tree.** With a memo array or `HashMap`, Fibonacci only has n *distinct* states, each computed once. That's O(n) time instead of O(2ⁿ). That's DP in a nutshell: **time = number of distinct states × work per state**.\n- **Space is the depth d, not bᵈ**, because only one root-to-leaf path is on the call stack at any time.\n\n### Handy sums\n\n| Sum | Formula | Big-O | Shows up as |\n|-----|---------|-------|-------------|\n| 1 + 2 + … + n | n(n+1)/2 | O(n²) | Nested loops with `j < i`; checking every pair |\n| 1 + x + x² + … + xⁿ (x > 1) | (xⁿ⁺¹ − 1)/(x − 1) | O(xⁿ) | Recursion trees: dominated by the last level |\n| 1 + 2 + 4 + … + 2ⁿ | 2ⁿ⁺¹ − 1 | O(2ⁿ) | Nodes in a perfect binary tree; dynamic array resizing |\n| n + n/2 + n/4 + … | < 2n | O(n) | Quickselect, building a heap: dominated by the first term |\n| 1 + 1/2 + 1/3 + … + 1/n | ≈ ln n | O(log n) | Harmonic series: looping over the multiples of every i (n/1 + n/2 + … + n/n) costs O(n log n) |\n\n### Master theorem (divide and conquer)\n\nFor recursions that split into **a** calls on pieces of size **n/b**, with **O(nᵈ)** work outside the calls: `T(n) = aT(n/b) + O(n^d)`\n\n- if `d > log_b a`, the answer is `O(n^d)`: the top level dominates\n- if `d = log_b a`, the answer is `O(n^d log n)`: every level does equal work. Merge sort is `2T(n/2)+O(n)`, which gives `O(n log n)`.\n- if `d < log_b a`, the answer is `O(n^(log_b a))`: the leaves dominate\n\nThese are the same three cases as the geometric series above: growing, flat, or shrinking work per level.\n\n## Built-in operation costs (Java)\n\n| Operation | Cost |\n|-----------|------|\n| `ArrayList.add(x)`, `list.remove(list.size() - 1)` | O(1) amortized |\n| `list.add(0, x)`, `list.remove(0)`, `list.contains(x)` | O(n). Use `ArrayDeque` for both ends, or a `HashSet` for lookups. |\n| `ArrayDeque` `offer`/`poll`/`push`/`pop`/`peek` at either end | O(1) |\n| `HashMap` / `HashSet` `get`, `put`, `containsKey`, `contains` | O(1) average |\n| `TreeMap` / `TreeSet` `get`, `put`, `floorKey`, `ceilingKey` | O(log n) |\n| `Arrays.sort` / `Collections.sort` | O(n log n) |\n| `PriorityQueue` `offer` / `poll` | O(log n). `peek` is O(1), `remove(obj)` is O(n). |\n| `new PriorityQueue<>(collection)` | O(n) |\n| `s += t` on a `String` in a loop | O(n²) overall. Use a `StringBuilder`. |\n| `substring`, `Arrays.copyOfRange`, `toCharArray`, `clone()` | O(length): they copy |\n\n## Pitfalls\n\n- Forgetting to count recursion stack space.\n- Calling `list.contains(x)` inside a loop, which silently makes it O(n²).\n- Treating `substring` or array copying as O(1).\n- Using sorting when O(n) is expected.\n\n## Practice\n\nThere are no specific problems for this topic. State the complexity of every problem you solve in the other topics.\n\n## My Notes\n\n-\n"}, {"id": "01-Arrays-and-Hashing", "file": "01-Arrays-and-Hashing.md", "title": "01 · Arrays & Hashing", "md": "# 01 · Arrays & Hashing\n\n> **Prereqs:** 00 · **Time:** 7–8 days · **Sources:** NeetCode 150/250, Striver A2Z + SDE sheet, Love Babbar 450, LeetCode Discuss FAANG threads\n\nWork through the subtopics in order. Each one has an explanation, a worked example, a Java template, further reading and its questions (Easy, then Medium, then Hard). Then use **Misc** as a mixed self-test, where the pattern isn't given away by the heading.\n\n## When to use\n\n- \"Have I seen this before?\", \"count occurrences\", \"find the pair or complement\": use a **hash map or set**.\n- \"Sum or count of a subarray\", especially with negative numbers: use **prefix sums**, often combined with a hash map.\n- \"Maximum sum of a contiguous subarray\": use **Kadane's algorithm**.\n- Grouping items by a property (anagrams, for example): use a **hash map with a canonical key**.\n- \"Top K most frequent\" with frequencies bounded by n: use **bucket sort**.\n- \"Element appearing more than n/2 (or n/3) times\" in O(1) space: use **Boyer-Moore voting**.\n- Values in the range `1..n` and O(1) extra space: use **index as hash**, either cyclic sort or sign marking.\n- Sorting an array with only 2 or 3 distinct kinds of values in one pass: use **Dutch national flag** partitioning.\n\n## Subtopics at a glance\n\n| # | Subtopic | Key idea | Typical cost |\n|---|----------|----------|--------------|\n| 1 | Array manipulation | Reverse, rotate, scan from the right | O(n) time, O(1) space |\n| 2 | Hashing: sets and maps | Trade O(n) memory for O(1) lookups | O(n) time, O(n) space |\n| 3 | Top K and bucket sort | Index the buckets by frequency | O(n) |\n| 4 | Prefix sums | `sum(l..r) = pre[r+1] - pre[l]`, with a map of earlier prefixes | O(n) |\n| 5 | Kadane's algorithm | Extend the current subarray, or restart | O(n), O(1) |\n| 6 | Boyer-Moore voting | Pairs of different values cancel out | O(n), O(1) |\n| 7 | Index as hash | Value v belongs at index v − 1 | O(n), O(1) |\n| 8 | Partitioning | Three pointers: low, mid, high | O(n), O(1) |\n| 9 | Sorting tricks and merge-sort counting | Sort first, or count pairs during merging | O(n log n) |\n| 10 | Design with hashing | Map plus list or array | O(1) per operation |\n\n## 1. Array manipulation\n\n### About\n\nThese are the building blocks that FAANG warm-up questions and the Striver/Babbar \"easy\" sections test: traversal, in-place rotation, scanning from the right, and building the next arrangement. The trick is usually to avoid an extra array by **reversing** parts of the input or **scanning in the right direction**.\n\n- **Rotate by k**: reverse the whole array, then reverse each part. This is O(1) space.\n- **Leaders / greatest to the right**: scan from the right and track the maximum so far.\n- **Next permutation**: find the first \"dip\" from the right, swap it with the smallest larger value to its right, then reverse the suffix.\n\n### Example\n\nRotate `[1,2,3,4,5,6,7]` right by `k = 3`:\n1. Reverse everything: `[7,6,5,4,3,2,1]`\n2. Reverse the first k: `[5,6,7,4,3,2,1]`\n3. Reverse the rest: `[5,6,7,1,2,3,4]` ✅\n\nNext permutation of `[1,3,5,4,2]`: the first dip from the right is `3` (because `3 < 5`). The smallest value to its right that's bigger than 3 is `4`. Swap them to get `[1,4,5,3,2]`, then reverse the suffix after index 1 to get `[1,4,2,3,5]`.\n\n### Template\n\n```java\n// Rotate right by k with three reversals\nk %= n;\nreverse(a, 0, n - 1);\nreverse(a, 0, k - 1);\nreverse(a, k, n - 1);\n\n// Leaders: scan from the right, tracking the max so far\nint maxRight = Integer.MIN_VALUE;\nfor (int i = n - 1; i >= 0; i--) {\n    if (a[i] > maxRight) leaders.add(a[i]);\n    maxRight = Math.max(maxRight, a[i]);\n}\n\n// Next permutation\nint i = n - 2;\nwhile (i >= 0 && a[i] >= a[i + 1]) i--;   // 1. first dip from the right\nif (i >= 0) {\n    int j = n - 1;\n    while (a[j] <= a[i]) j--;             // 2. smallest value on the right that's bigger than a[i]\n    swap(a, i, j);\n}\nreverse(a, i + 1, n - 1);                 // 3. make the suffix as small as possible\n```\n\n### Read more\n\n- [Next lexicographical permutation algorithm (Nayuki)](https://www.nayuki.io/page/next-lexicographical-permutation-algorithm): the clearest illustrated explanation.\n- [Permutation: generation in lexicographic order (Wikipedia)](https://en.wikipedia.org/wiki/Permutation#Generation_in_lexicographic_order)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 1929 | [Concatenation of Array](https://leetcode.com/problems/concatenation-of-array/) | E | Warm-up |\n| [ ] | 414 | [Third Maximum Number](https://leetcode.com/problems/third-maximum-number/) | E | Track the top 3 in one pass |\n| [ ] | 1752 | [Check if Array Is Sorted and Rotated](https://leetcode.com/problems/check-if-array-is-sorted-and-rotated/) | E | Count the drops (at most 1) |\n| [ ] | 485 | [Max Consecutive Ones](https://leetcode.com/problems/max-consecutive-ones/) | E | Running count |\n| [ ] | 1299 | [Replace Elements with Greatest Element on Right Side](https://leetcode.com/problems/replace-elements-with-greatest-element-on-right-side/) | E | Scan from the right (leaders) |\n| [ ] | 118 | [Pascal's Triangle](https://leetcode.com/problems/pascals-triangle/) | E | Build each row from the previous one |\n| [ ] | 189 | [Rotate Array](https://leetcode.com/problems/rotate-array/) | M | Three reversals |\n| [ ] | 2149 | [Rearrange Array Elements by Sign](https://leetcode.com/problems/rearrange-array-elements-by-sign/) | M | Two write indices (even/odd) |\n| [ ] | 31 | [Next Permutation](https://leetcode.com/problems/next-permutation/) | M | Dip, swap, reverse suffix ⭐ |\n\n## 2. Hashing: sets and maps\n\n### About\n\nA `HashSet` answers \"have I seen x?\" in O(1) on average, and a `HashMap` answers \"how many times, or where, have I seen x?\". Most O(n²) brute-force pair checks become O(n) once you store what you've already seen.\n\n- **Complement lookup**: for each x, check whether `target - x` has been seen *before* it.\n- **Frequency counting**: `int[26]` for lowercase letters (faster, with no boxing), otherwise `map.merge(x, 1, Integer::sum)`.\n- **Canonical key**: map every item to a key that's equal for items in the same group (sorted letters, a count signature, a row tuple).\n- **Bijection checks** (isomorphic strings, word pattern): use two maps, one for each direction.\n\n### Example\n\nTwo Sum, with `nums = [2,7,11,15]` and `target = 9`:\n- i = 0: we need 7, which we haven't seen. Store `2 → 0`.\n- i = 1: we need 2, and we've seen it at index 0. The answer is `[0, 1]`.\n\nLongest Consecutive Sequence, with `[100,4,200,1,3,2]`: put everything in a set. Only start counting from numbers whose `x − 1` is *not* in the set (here, 1, 100 and 200). Counting up from 1 finds 1, 2, 3, 4, a length of 4. Each number is visited at most twice, so this is O(n).\n\n### Template\n\n```java\n// Frequency count (lowercase letters)\nint[] cnt = new int[26];\nfor (char c : s.toCharArray()) cnt[c - 'a']++;\n\n// Frequency count (general keys)\nMap<Integer, Integer> freq = new HashMap<>();\nfor (int x : nums) freq.merge(x, 1, Integer::sum);\n\n// Complement lookup (Two Sum)\nMap<Integer, Integer> seen = new HashMap<>();\nfor (int i = 0; i < nums.length; i++) {\n    Integer j = seen.get(target - nums[i]);\n    if (j != null) return new int[]{j, i};\n    seen.put(nums[i], i);\n}\n\n// Longest consecutive: only count from the start of a run\nSet<Integer> set = new HashSet<>();\nfor (int x : nums) set.add(x);\nint best = 0;\nfor (int x : set) {\n    if (set.contains(x - 1)) continue;   // not the start of a run\n    int len = 1;\n    while (set.contains(x + len)) len++;\n    best = Math.max(best, len);\n}\n\n// Canonical key grouping (anagrams)\nMap<String, List<String>> groups = new HashMap<>();\nfor (String w : words) {\n    char[] cs = w.toCharArray();\n    Arrays.sort(cs);\n    groups.computeIfAbsent(new String(cs), x -> new ArrayList<>()).add(w);\n}\n```\n\n### Read more\n\n- [Hash table (Wikipedia)](https://en.wikipedia.org/wiki/Hash_table): collisions, load factor, and why the worst case is O(n).\n- [`HashMap` Javadoc](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html): `merge`, `computeIfAbsent`, `getOrDefault`.\n- [Highest frequency element (takeUforward)](https://takeuforward.org/blogs/data-structure-and-algorithm/highest-freq-element): Striver's hashing intro.\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 217 | [Contains Duplicate](https://leetcode.com/problems/contains-duplicate/) | E | Set |\n| [ ] | 242 | [Valid Anagram](https://leetcode.com/problems/valid-anagram/) | E | Counting |\n| [ ] | 1 | [Two Sum](https://leetcode.com/problems/two-sum/) | E | Complement map ⭐ |\n| [ ] | 349 | [Intersection of Two Arrays](https://leetcode.com/problems/intersection-of-two-arrays/) | E | Set intersection |\n| [ ] | 387 | [First Unique Character in a String](https://leetcode.com/problems/first-unique-character-in-a-string/) | E | Count, then scan |\n| [ ] | 205 | [Isomorphic Strings](https://leetcode.com/problems/isomorphic-strings/) | E | Two-way mapping |\n| [ ] | 290 | [Word Pattern](https://leetcode.com/problems/word-pattern/) | E | Two-way mapping |\n| [ ] | 49 | [Group Anagrams](https://leetcode.com/problems/group-anagrams/) | M | Canonical key ⭐ |\n| [ ] | 36 | [Valid Sudoku](https://leetcode.com/problems/valid-sudoku/) | M | Sets per row/col/box |\n| [ ] | 128 | [Longest Consecutive Sequence](https://leetcode.com/problems/longest-consecutive-sequence/) | M | Set, start of sequence ⭐ |\n| [ ] | 532 | [K-diff Pairs in an Array](https://leetcode.com/problems/k-diff-pairs-in-an-array/) | M | Count map, look up x + k |\n| [ ] | 1010 | [Pairs of Songs With Total Durations Divisible by 60](https://leetcode.com/problems/pairs-of-songs-with-total-durations-divisible-by-60/) | M | Complement of remainders |\n| [ ] | 454 | [4Sum II](https://leetcode.com/problems/4sum-ii/) | M | Meet in the middle with a map |\n| [ ] | 554 | [Brick Wall](https://leetcode.com/problems/brick-wall/) | M | Count the edge positions |\n\n## 3. Top K and bucket sort\n\n### About\n\nSorting by frequency costs O(n log n). Because a frequency can never exceed n, you can instead make an array of **n + 1 buckets indexed by frequency** and read it from the top. This is O(n). A heap (topic 09) is the alternative when you need streaming or lexicographic tie-breaks. Counting sort uses the same \"bounded values\" idea, as in H-Index.\n\n### Example\n\n`nums = [1,1,1,2,2,3]`, `k = 2`. The frequencies are `{1:3, 2:2, 3:1}`, so `buckets[3] = [1]`, `buckets[2] = [2]` and `buckets[1] = [3]`. Reading from the top gives `[1, 2]`.\n\n### Template\n\n```java\n// Top K frequent with bucket sort: index = frequency\nMap<Integer, Integer> freq = new HashMap<>();\nfor (int x : nums) freq.merge(x, 1, Integer::sum);\nList<List<Integer>> buckets = new ArrayList<>();\nfor (int f = 0; f <= nums.length; f++) buckets.add(new ArrayList<>());\nfreq.forEach((x, f) -> buckets.get(f).add(x));\nint[] res = new int[k];\nint i = 0;\nfor (int f = nums.length; f > 0 && i < k; f--)\n    for (int x : buckets.get(f))\n        if (i < k) res[i++] = x;\n```\n\n### Read more\n\n- [Bucket sort (Wikipedia)](https://en.wikipedia.org/wiki/Bucket_sort)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 347 | [Top K Frequent Elements](https://leetcode.com/problems/top-k-frequent-elements/) | M | Bucket sort / heap ⭐ |\n| [ ] | 451 | [Sort Characters By Frequency](https://leetcode.com/problems/sort-characters-by-frequency/) | M | Bucket sort |\n| [ ] | 692 | [Top K Frequent Words](https://leetcode.com/problems/top-k-frequent-words/) | M | Heap with tie-break on the word |\n| [ ] | 274 | [H-Index](https://leetcode.com/problems/h-index/) | M | Counting sort, capped at n |\n\n## 4. Prefix sums\n\n### About\n\nPrecompute `pre[i] = a[0] + … + a[i-1]` once, and any range sum becomes `pre[r+1] − pre[l]` in O(1). Combined with a hash map of the prefixes seen so far, \"count or find subarrays with sum k\" becomes O(n), **and it works with negative numbers**, unlike a sliding window.\n\n- **Count subarrays with sum k**: map each prefix to how many times it has occurred, and seed it with `{0: 1}`.\n- **Longest subarray with sum k**: map each prefix to its **first** index, and seed it with `{0: -1}`.\n- **Divisible by k**: use `((sum % k) + k) % k` as the key, because Java's `%` can be negative.\n- **Equal numbers of 0s and 1s**: replace each 0 with −1, and the question becomes \"longest subarray with sum 0\".\n- **Product except self**: a prefix-product pass, then a suffix-product pass, with no division.\n- **2D**: `P[r+1][c+1] = a[r][c] + P[r][c+1] + P[r+1][c] − P[r][c]` (inclusion–exclusion).\n\n### Example\n\n`nums = [1,2,3]`, `k = 3`. The running prefix goes 1, 3, 6.\n- At prefix 1, we need 1 − 3 = −2. It hasn't been seen, so nothing is added.\n- At prefix 3, we need 0. It has been seen once (the seed), so the count becomes 1 (that's `[1,2]`).\n- At prefix 6, we need 3. It has been seen once, so the count becomes 2 (that's `[3]`). The answer is **2**.\n\n### Template\n\n```java\n// Build prefix sums: pre[i] = sum of a[0..i-1]\nint[] pre = new int[n + 1];\nfor (int i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];\n// sum(a[l..r]) = pre[r + 1] - pre[l]\n\n// Count subarrays with sum == k (works with negatives)\nMap<Integer, Integer> pref = new HashMap<>();\npref.put(0, 1);\nint count = 0, sum = 0;\nfor (int x : nums) {\n    sum += x;\n    count += pref.getOrDefault(sum - k, 0);\n    pref.merge(sum, 1, Integer::sum);\n}\n\n// Longest subarray with sum == k: store the FIRST index of each prefix\nMap<Integer, Integer> first = new HashMap<>();\nfirst.put(0, -1);\nint sum = 0, best = 0;\nfor (int i = 0; i < n; i++) {\n    sum += a[i];\n    if (first.containsKey(sum - k)) best = Math.max(best, i - first.get(sum - k));\n    first.putIfAbsent(sum, i);\n}\n\n// Product of array except self: prefix pass, then suffix pass\nint[] res = new int[n];\nres[0] = 1;\nfor (int i = 1; i < n; i++) res[i] = res[i - 1] * a[i - 1];\nint suffix = 1;\nfor (int i = n - 1; i >= 0; i--) {\n    res[i] *= suffix;\n    suffix *= a[i];\n}\n```\n\n### Read more\n\n- [Prefix sum (Wikipedia)](https://en.wikipedia.org/wiki/Prefix_sum)\n- [Hashing and Prefix Sum: Definitive Guide (LeetCode Discuss)](https://leetcode.com/discuss/study-guide/4781120/Hashing-and-Prefix-Sum-:-Definitive-Guide/)\n- [Prefix sum study summary (LeetCode Discuss)](https://leetcode.com/discuss/study-guide/2719912/Prefix-sum-study-summary/): problems grouped by use case.\n- [Subarray Sum Patterns (LeetCode Discuss)](https://leetcode.com/discuss/post/5284478/Subarray-Sum-Patterns/)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 303 | [Range Sum Query - Immutable](https://leetcode.com/problems/range-sum-query-immutable/) | E | Prefix sum |\n| [ ] | 724 | [Find Pivot Index](https://leetcode.com/problems/find-pivot-index/) | E | Left sum vs total − left − a[i] |\n| [ ] | 238 | [Product of Array Except Self](https://leetcode.com/problems/product-of-array-except-self/) | M | Prefix & suffix ⭐ |\n| [ ] | 304 | [Range Sum Query 2D - Immutable](https://leetcode.com/problems/range-sum-query-2d-immutable/) | M | 2D prefix sum |\n| [ ] | 560 | [Subarray Sum Equals K](https://leetcode.com/problems/subarray-sum-equals-k/) | M | Prefix sum + count map ⭐ |\n| [ ] | 325 | [Maximum Size Subarray Sum Equals k](https://leetcode.com/problems/maximum-size-subarray-sum-equals-k/) 🔒 | M | Prefix sum + first-index map |\n| [ ] | 525 | [Contiguous Array](https://leetcode.com/problems/contiguous-array/) | M | 0 → −1, longest sum 0 |\n| [ ] | 523 | [Continuous Subarray Sum](https://leetcode.com/problems/continuous-subarray-sum/) | M | Prefix mod k, first index |\n| [ ] | 974 | [Subarray Sums Divisible by K](https://leetcode.com/problems/subarray-sums-divisible-by-k/) | M | Prefix mod k, count map |\n\n## 5. Kadane's algorithm\n\n### About\n\nThe best subarray **ending at i** either extends the best one ending at i − 1 or starts fresh at i: `cur = max(a[i], cur + a[i])`. Track the best value seen overall. It's the most-asked array DP in Indian product-company and FAANG screens, and Babbar marks it \"V.V. IMP\".\n\n- **Return the subarray too**: reset `start` whenever `cur` drops to 0 or below before adding a[i].\n- **Circular array**: the answer is `max(normal Kadane, total − minimum subarray)`. If every number is negative, return the normal Kadane result.\n- **Product instead of sum**: track both the max and the min, because a negative times a negative flips them. That's topic 13 (Maximum Product Subarray).\n\n### Example\n\n`[-2,1,-3,4,-1,2,1,-5,4]`: `cur` goes −2, 1, −2, **4, 3, 5, 6**, 1, 5. The best is **6**, from `[4,-1,2,1]`.\n\n### Template\n\n```java\n// Kadane: extend or restart\nint best = nums[0], cur = nums[0];\nfor (int i = 1; i < nums.length; i++) {\n    cur = Math.max(nums[i], cur + nums[i]);\n    best = Math.max(best, cur);\n}\n\n// Kadane returning the subarray boundaries\nint best = Integer.MIN_VALUE, cur = 0, start = 0, bestL = 0, bestR = 0;\nfor (int i = 0; i < n; i++) {\n    if (cur <= 0) { cur = 0; start = i; }\n    cur += a[i];\n    if (cur > best) { best = cur; bestL = start; bestR = i; }\n}\n```\n\n### Read more\n\n- [Search the subsegment with the maximum/minimum sum (cp-algorithms)](https://cp-algorithms.com/others/maximum_average_segment.html): both the prefix-sum and Kadane views.\n- [Maximum subarray problem (Wikipedia)](https://en.wikipedia.org/wiki/Maximum_subarray_problem)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 53 | [Maximum Subarray](https://leetcode.com/problems/maximum-subarray/) | M | Kadane ⭐ |\n| [ ] | 918 | [Maximum Sum Circular Subarray](https://leetcode.com/problems/maximum-sum-circular-subarray/) | M | max(Kadane, total − min subarray) |\n\n## 6. Boyer-Moore voting\n\n### About\n\nIf one value appears more than n/2 times, cancelling each occurrence against a *different* value always leaves it standing. That gives O(n) time and O(1) space, without a hash map. For \"more than n/3\", keep **two** candidates (in general, k − 1 candidates for n/k), then **verify** them with a second pass, because the cancellation only produces candidates.\n\n### Example\n\n`[2,2,1,1,1,2,2]`:\n\n| x | 2 | 2 | 1 | 1 | 1 | 2 | 2 |\n|---|---|---|---|---|---|---|---|\n| candidate | 2 | 2 | 2 | 2 | 1 | 1 | 2 |\n| count | 1 | 2 | 1 | 0 | 1 | 0 | 1 |\n\nAt the fifth element the count is 0, so the candidate becomes 1. The next 2 cancels it back to 0, so the last element makes 2 the candidate again. The answer is **2**.\n\n### Template\n\n```java\n// Boyer-Moore voting (majority > n/2 guaranteed)\nint cand = 0, count = 0;\nfor (int x : nums) {\n    if (count == 0) cand = x;\n    count += (x == cand) ? 1 : -1;\n}\nreturn cand;\n\n// Extended voting (> n/3): two candidates, then verify\nint c1 = 0, c2 = 1, n1 = 0, n2 = 0;   // start with two different values\nfor (int x : nums) {\n    if (x == c1) n1++;\n    else if (x == c2) n2++;\n    else if (n1 == 0) { c1 = x; n1 = 1; }\n    else if (n2 == 0) { c2 = x; n2 = 1; }\n    else { n1--; n2--; }\n}\n// second pass: count c1 and c2, keep each one whose count is > n / 3\n```\n\n### Read more\n\n- [Boyer–Moore majority vote algorithm (Wikipedia)](https://en.wikipedia.org/wiki/Boyer%E2%80%93Moore_majority_vote_algorithm)\n- [Majority Element, n/2 (takeUforward)](https://takeuforward.org/blogs/data-structure-and-algorithm/majority-element-n-by-2)\n- [Majority Element II, n/3 (takeUforward)](https://takeuforward.org/blogs/data-structure-and-algorithm/majority-element-ii-n-by-3): brute force, then hashing, then voting, plus the n/k generalisation.\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 169 | [Majority Element](https://leetcode.com/problems/majority-element/) | E | Boyer-Moore |\n| [ ] | 229 | [Majority Element II](https://leetcode.com/problems/majority-element-ii/) | M | Two candidates + verify ⭐ |\n\n## 7. Index as hash (cyclic sort and sign marking)\n\n### About\n\nWhen the values are in `1..n` and the problem asks for missing or duplicate numbers in O(1) extra space, **the array itself is the hash table**: value `v` belongs at index `v − 1`.\n\n- **Cyclic sort**: keep swapping `a[i]` into its home slot until slot i holds the right value or an unusable one. Every swap places one value permanently, so the whole thing is O(n).\n- **Sign marking**: to record that v was seen, negate `a[v − 1]`. Use `Math.abs` when reading values, because they may already be negative.\n\n### Example\n\nFirst Missing Positive, with `[3,4,-1,1]`. Cyclic sort moves 3 to index 2, 4 to index 3 and 1 to index 0, which gives `[1,-1,3,4]`. Index 1 doesn't hold 2, so the answer is **2**.\n\n### Template\n\n```java\n// Cyclic sort: put each value v in 1..n at index v - 1\nfor (int i = 0; i < n; ) {\n    int v = a[i];\n    if (v >= 1 && v <= n && a[v - 1] != v) { a[i] = a[v - 1]; a[v - 1] = v; }\n    else i++;\n}\n// afterwards, the first i with a[i] != i + 1 means i + 1 is missing (and a[i] is a duplicate)\n\n// Sign marking: record \"v seen\" by negating a[v - 1]\nfor (int x : a) {\n    int idx = Math.abs(x) - 1;\n    if (a[idx] < 0) duplicates.add(idx + 1);\n    else a[idx] = -a[idx];\n}\n```\n\n### Read more\n\n- [Cycle sort (Wikipedia)](https://en.wikipedia.org/wiki/Cycle_sort)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 448 | [Find All Numbers Disappeared in an Array](https://leetcode.com/problems/find-all-numbers-disappeared-in-an-array/) | E | Sign marking |\n| [ ] | 645 | [Set Mismatch](https://leetcode.com/problems/set-mismatch/) | E | Repeating + missing (index as hash or math) |\n| [ ] | 442 | [Find All Duplicates in an Array](https://leetcode.com/problems/find-all-duplicates-in-an-array/) | M | Sign marking |\n| [ ] | 41 | [First Missing Positive](https://leetcode.com/problems/first-missing-positive/) | H | Cyclic sort ⭐ |\n\n## 8. Partitioning (Dutch national flag)\n\n### About\n\nRearrange the array in place into groups (less than, equal to, greater than a pivot, or 0s, 1s and 2s) in **one pass**. Keep three regions: `[0, lo)` is done-low, `[lo, mid)` is done-middle, and `(hi, n−1]` is done-high. `[mid, hi]` is still unknown. Quicksort's 3-way partition uses the same loop.\n\n### Example\n\n`[2,0,2,1,1,0]`: swap the 2 to the back, pull the 0s to the front and step over the 1s. The result is `[0,0,1,1,2,2]`. Every element is looked at once.\n\n### Template\n\n```java\n// Dutch national flag: [0..lo) = 0s, [lo..mid) = 1s, (hi..n-1] = 2s\nint lo = 0, mid = 0, hi = n - 1;\nwhile (mid <= hi) {\n    if (a[mid] == 0) swap(a, lo++, mid++);\n    else if (a[mid] == 1) mid++;\n    else swap(a, mid, hi--);   // don't advance mid: the value swapped in hasn't been checked yet\n}\n```\n\n### Read more\n\n- [Dutch national flag problem (Wikipedia)](https://en.wikipedia.org/wiki/Dutch_national_flag_problem)\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 905 | [Sort Array By Parity](https://leetcode.com/problems/sort-array-by-parity/) | E | Two-way partition |\n| [ ] | 75 | [Sort Colors](https://leetcode.com/problems/sort-colors/) | M | Dutch national flag ⭐ |\n| [ ] | 2161 | [Partition Array According to Given Pivot](https://leetcode.com/problems/partition-array-according-to-given-pivot/) | M | Stable 3-way partition |\n\n## 9. Sorting tricks and merge-sort counting\n\n### About\n\n- **Sort first**: once the array is sorted, \"the closest k values\" become a window of k neighbours (Babbar's chocolate distribution), and \"add or subtract K from each height\" becomes a single split point (Babbar's minimise the heights).\n- **Count pairs during merge sort**: to count pairs `i < j` with `a[i] > a[j]` (inversions) or `a[i] > 2·a[j]` (reverse pairs), count across the two sorted halves before merging them. This takes O(n log n). It's Striver's \"hard arrays\" favourite.\n\n### Example\n\nReverse Pairs, with `[1,3,2,3,1]`: the pairs are (3 at index 1, 1 at index 4) and (3 at index 3, 1 at index 4), so the answer is **2**. When the two halves are merged, both 3s in the left half see the 1 in the right half.\n\n### Template\n\n```java\n// Count pairs i < j with a[i] > 2 * a[j] using merge sort (Reverse Pairs)\nint sortCount(int[] a, int lo, int hi) {   // sorts a[lo..hi] and returns the pair count\n    if (lo >= hi) return 0;\n    int mid = (lo + hi) >>> 1;\n    int count = sortCount(a, lo, mid) + sortCount(a, mid + 1, hi);\n    for (int i = lo, j = mid + 1; i <= mid; i++) {   // both halves are sorted here\n        while (j <= hi && a[i] > 2L * a[j]) j++;\n        count += j - (mid + 1);\n    }\n    merge(a, lo, mid, hi);   // standard merge of the two sorted halves\n    return count;\n}\n// For inversions, use a[i] > a[j] in the counting loop.\n```\n\n### Read more\n\n- [Inversion (Wikipedia)](https://en.wikipedia.org/wiki/Inversion_(discrete_mathematics))\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 1984 | [Minimum Difference Between Highest and Lowest of K Scores](https://leetcode.com/problems/minimum-difference-between-highest-and-lowest-of-k-scores/) | E | Sort + window of k (chocolate distribution) |\n| [ ] | 910 | [Smallest Range II](https://leetcode.com/problems/smallest-range-ii/) | M | Sort + try every split (minimise the heights) |\n| [ ] | 493 | [Reverse Pairs](https://leetcode.com/problems/reverse-pairs/) | H | Merge-sort counting |\n\n## 10. Design with hashing\n\n### About\n\nThese are design rounds built on hashing. The usual combination is a **map for lookups plus an array or list for indexing**. To delete from the list in O(1), swap the element with the last one and pop. To serialise a list of strings safely, prefix each one with its length.\n\n### Example\n\nInsert Delete GetRandom O(1), after inserting 5, 7 and 9: `vals = [5,7,9]` and `idx = {5:0, 7:1, 9:2}`. To remove 5, move the last value (9) into index 0, then pop. Now `vals = [9,7]` and `idx = {9:0, 7:1}`. `getRandom` picks a random index into `vals`.\n\n### Template\n\n```java\n// Insert/Delete/GetRandom O(1): list of values + map from value to index\nList<Integer> vals = new ArrayList<>();\nMap<Integer, Integer> idx = new HashMap<>();\nRandom rnd = new Random();\nboolean insert(int v) {\n    if (idx.containsKey(v)) return false;\n    idx.put(v, vals.size());\n    vals.add(v);\n    return true;\n}\nboolean remove(int v) {\n    Integer i = idx.remove(v);\n    if (i == null) return false;\n    int last = vals.remove(vals.size() - 1);\n    if (i < vals.size()) { vals.set(i, last); idx.put(last, i); }\n    return true;\n}\nint getRandom() { return vals.get(rnd.nextInt(vals.size())); }\n\n// Encode a list of strings with length prefixes: [\"ab\", \"c#d\"] -> \"2#ab3#c#d\"\nStringBuilder sb = new StringBuilder();\nfor (String s : strs) sb.append(s.length()).append('#').append(s);\n```\n\n### Questions\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 706 | [Design HashMap](https://leetcode.com/problems/design-hashmap/) | E | Buckets + chaining |\n| [ ] | 271 | [Encode and Decode Strings](https://leetcode.com/problems/encode-and-decode-strings/) 🔒 | M | Length prefix |\n| [ ] | 380 | [Insert Delete GetRandom O(1)](https://leetcode.com/problems/insert-delete-getrandom-o1/) | M | Map + list, swap with last ⭐ |\n\n## Misc (mixed self-test)\n\nThese come up a lot in FAANG array rounds and mix the patterns above. Turn on **Hide patterns** and work out the technique yourself.\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 2352 | [Equal Row and Column Pairs](https://leetcode.com/problems/equal-row-and-column-pairs/) | M | Hash each row as a key |\n| [ ] | 299 | [Bulls and Cows](https://leetcode.com/problems/bulls-and-cows/) | M | Digit counts |\n| [ ] | 1497 | [Check If Array Pairs Are Divisible by k](https://leetcode.com/problems/check-if-array-pairs-are-divisible-by-k/) | M | Remainder counts |\n| [ ] | 334 | [Increasing Triplet Subsequence](https://leetcode.com/problems/increasing-triplet-subsequence/) | M | Track the two smallest so far |\n| [ ] | 289 | [Game of Life](https://leetcode.com/problems/game-of-life/) | M | Encode old and new state in place |\n\n## Covered in other topics\n\nThese are also on the array sections of Striver, Babbar or NeetCode, but they live with the technique they test:\n\n- **Two Pointers ([02](02-Two-Pointers.md))**: Move Zeroes, Remove Duplicates from Sorted Array, Merge Sorted Array (Babbar's \"merge without extra space\"), 3Sum and 4Sum (Babbar's \"triplet with given sum\"), Trapping Rain Water, Two Sum II.\n- **Sliding Window ([03](03-Sliding-Window.md))**: Best Time to Buy and Sell Stock, Minimum Size Subarray Sum (Babbar's \"smallest subarray with sum greater than x\"), Max Consecutive Ones III.\n- **Binary Search ([05](05-Binary-Search.md))**: Search in Rotated Sorted Array, First and Last Position, Median of Two Sorted Arrays.\n- **Linked List ([06](06-Linked-List.md))**: Find the Duplicate Number (Floyd's algorithm on the array).\n- **Heaps ([09](09-Heaps.md))**: Kth Largest Element (Babbar's \"Kth max and min\").\n- **DP 1D ([13](13-DP-1D.md))**: Maximum Product Subarray.\n- **Greedy ([15](15-Greedy.md))**: Jump Game II (Babbar's \"minimum jumps to reach the end\").\n- **Intervals ([16](16-Intervals.md))**: Merge Intervals.\n- **Math & Geometry ([17](17-Math-and-Geometry.md))**: Set Matrix Zeroes, Rotate Image, Spiral Matrix.\n- **Bit Manipulation ([18](18-Bit-Manipulation.md))**: Missing Number, Single Number.\n- **Advanced ([19](19-Advanced-Optional.md))**: Count of Smaller Numbers After Self.\n\n## GFG-only classics (no exact LeetCode version)\n\nThese appear on Striver's or Babbar's sheets. Each one uses a pattern from above, so you can do them on GeeksforGeeks once the matching subtopic feels comfortable:\n\n- Second largest element (subtopic 1) · Union of two sorted arrays (two pointers) · Leaders in an array (subtopic 1, like 1299)\n- Longest subarray with sum K, positives only (sliding window) · Largest subarray with 0 sum (subtopic 4, like 325 with k = 0) · Count subarrays with XOR = K (subtopic 4, with XOR instead of sum)\n- Repeating and missing number (subtopic 7, like 645) · Count inversions (subtopic 9)\n- Common elements in 3 sorted arrays (three pointers) · Array subset of another array (subtopic 2) · Factorial of a large number (digit array)\n- Minimum swaps to bring elements ≤ K together (fixed sliding window) · Minimum merge operations to make an array a palindrome (two pointers)\n\n## Pitfalls\n\n- Prefix-sum map: forgetting to seed it with `pref.put(0, 1)` (for counting) or `first.put(0, -1)` (for longest).\n- Using an `int[]` as a map key. Arrays hash by identity, so two equal arrays never match. Convert it to a `String` first.\n- Comparing boxed `Integer`s with `==`. It only works for -128 to 127. Use `.equals()` or unbox to `int`.\n- Adding to or removing from a collection inside a for-each loop over it, which throws `ConcurrentModificationException`.\n- Negative numbers break the \"shrink the window\" approach. Use prefix sums instead.\n- Java's `%` returns negative results for negative sums. Normalise with `((x % k) + k) % k`.\n- Rotate by k: forgetting `k %= n` when k ≥ n.\n- Dutch national flag: advancing `mid` after swapping with `hi`.\n\n🔒 = requires LeetCode Premium (the same problem is free on NeetCode or LintCode). ⭐ = very frequently asked.\n\n## My Notes\n\n-\n"}, {"id": "02-Two-Pointers", "file": "02-Two-Pointers.md", "title": "02 · Two Pointers", "md": "# 02 · Two Pointers\n\n> **Prereqs:** 01 · **Time:** 2–3 days\n\n## When to use\n\n- The input is **sorted**, or sorting it doesn't break the problem, and you're looking for a pair or triplet with a target sum.\n- Palindrome checks, or comparing from both ends.\n- **In-place** array changes such as removing elements, deduplicating or partitioning.\n- Merging two sorted sequences.\n\n## Core concepts\n\n- **Opposite ends**: `l = 0, r = n - 1`, then move the pointers inward based on a comparison.\n- **Same direction (fast/slow, read/write)**: one pointer reads every element and the other marks where the next valid element is written.\n- **Reducing k-Sum**: sort, fix one element, then run two-sum on the rest. 3Sum is O(n²) and 4Sum is O(n³).\n\n## Templates\n\n```java\n// Opposite ends on a sorted array\nint l = 0, r = a.length - 1;\nwhile (l < r) {\n    int s = a[l] + a[r];\n    if (s == target) return new int[]{l, r};\n    if (s < target) l++;\n    else r--;\n}\n\n// Read/write pointer (in-place filter)\nint w = 0;\nfor (int x : nums)\n    if (keep(x)) nums[w++] = x;\nreturn w;\n\n// 3Sum skeleton with duplicate skipping\nArrays.sort(nums);\nList<List<Integer>> res = new ArrayList<>();\nfor (int i = 0; i < nums.length; i++) {\n    if (i > 0 && nums[i] == nums[i - 1]) continue;\n    int l = i + 1, r = nums.length - 1;\n    while (l < r) {\n        int s = nums[i] + nums[l] + nums[r];\n        if (s < 0) l++;\n        else if (s > 0) r--;\n        else {\n            res.add(List.of(nums[i], nums[l], nums[r]));\n            l++;\n            while (l < r && nums[l] == nums[l - 1]) l++;\n        }\n    }\n}\n```\n\n## Pitfalls\n\n- Not skipping duplicates in 3Sum or 4Sum.\n- 4Sum: adding four `int`s can overflow. Compute the sum as a `long`.\n- Using `l <= r` when the two pointers must point at different elements.\n- Sorting when you need to return the original indices.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 125 | [Valid Palindrome](https://leetcode.com/problems/valid-palindrome/) | E | Opposite ends |\n| [ ] | 283 | [Move Zeroes](https://leetcode.com/problems/move-zeroes/) | E | Read/write |\n| [ ] | 26 | [Remove Duplicates from Sorted Array](https://leetcode.com/problems/remove-duplicates-from-sorted-array/) | E | Read/write |\n| [ ] | 88 | [Merge Sorted Array](https://leetcode.com/problems/merge-sorted-array/) | E | Fill from the back |\n| [ ] | 167 | [Two Sum II - Input Array Is Sorted](https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/) | M | Opposite ends |\n| [ ] | 15 | [3Sum](https://leetcode.com/problems/3sum/) | M | Sort + fix + 2ptr |\n| [ ] | 11 | [Container With Most Water](https://leetcode.com/problems/container-with-most-water/) | M | Move the shorter side |\n| [ ] | 18 | [4Sum](https://leetcode.com/problems/4sum/) | M | k-Sum reduction |\n| [ ] | 42 | [Trapping Rain Water](https://leetcode.com/problems/trapping-rain-water/) | H | Left/right max |\n\n## My Notes\n\n-\n"}, {"id": "03-Sliding-Window", "file": "03-Sliding-Window.md", "title": "03 · Sliding Window", "md": "# 03 · Sliding Window\n\n> **Prereqs:** 01, 02 · **Time:** 3–4 days\n\n## When to use\n\n- The problem asks for the longest, shortest or count of **contiguous** subarrays or substrings that satisfy a condition.\n- The condition is **monotonic**: if a window is valid, so are its sub-windows (or it only becomes invalid as it grows).\n- A window of fixed size k.\n\n## Core concepts\n\n- **Fixed window**: add `a[r]`, remove `a[r-k]`.\n- **Variable window**: expand `r` every step and shrink `l` while the window is invalid.\n- Keep the window's state up to date incrementally with a counter, sum or set.\n- **\"Exactly K\" = atMost(K) − atMost(K−1).**\n- Sliding window maximum: use a **monotonic deque**.\n- ⚠️ Sliding window doesn't work with **negative numbers** for sum conditions. Use prefix sums instead.\n\n## Templates\n\n```java\n// Variable window: longest valid\nint[] count = new int[128];   // or a HashMap for general keys\nint l = 0, best = 0;\nfor (int r = 0; r < s.length(); r++) {\n    count[s.charAt(r)]++;\n    while (!valid(count)) {\n        count[s.charAt(l)]--;\n        l++;\n    }\n    best = Math.max(best, r - l + 1);\n}\n\n// Variable window: shortest valid\nint l = 0, best = Integer.MAX_VALUE;\nfor (int r = 0; r < a.length; r++) {\n    add(a[r]);\n    while (valid()) {\n        best = Math.min(best, r - l + 1);\n        remove(a[l++]);\n    }\n}\nreturn best == Integer.MAX_VALUE ? 0 : best;\n\n// Monotonic deque for window max\nDeque<Integer> dq = new ArrayDeque<>();   // indices, values decreasing\nint[] res = new int[nums.length - k + 1];\nfor (int i = 0; i < nums.length; i++) {\n    while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();\n    dq.offerLast(i);\n    if (dq.peekFirst() <= i - k) dq.pollFirst();\n    if (i >= k - 1) res[i - k + 1] = nums[dq.peekFirst()];\n}\n```\n\n## Pitfalls\n\n- Updating the answer at the wrong point. For \"longest\", update after shrinking. For \"shortest\", update while shrinking.\n- When you count distinct keys with `map.size()`, remove a key once its count reaches 0, otherwise the size is wrong.\n- Off-by-one errors in the window length `r - l + 1`.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 121 | [Best Time to Buy and Sell Stock](https://leetcode.com/problems/best-time-to-buy-and-sell-stock/) | E | Track the minimum so far |\n| [ ] | 3 | [Longest Substring Without Repeating Characters](https://leetcode.com/problems/longest-substring-without-repeating-characters/) | M | Variable, set |\n| [ ] | 424 | [Longest Repeating Character Replacement](https://leetcode.com/problems/longest-repeating-character-replacement/) | M | len − maxfreq ≤ k |\n| [ ] | 567 | [Permutation in String](https://leetcode.com/problems/permutation-in-string/) | M | Fixed, counts |\n| [ ] | 438 | [Find All Anagrams in a String](https://leetcode.com/problems/find-all-anagrams-in-a-string/) | M | Fixed, counts |\n| [ ] | 209 | [Minimum Size Subarray Sum](https://leetcode.com/problems/minimum-size-subarray-sum/) | M | Shortest valid |\n| [ ] | 1004 | [Max Consecutive Ones III](https://leetcode.com/problems/max-consecutive-ones-iii/) | M | At most k zeros |\n| [ ] | 76 | [Minimum Window Substring](https://leetcode.com/problems/minimum-window-substring/) | H | Shortest valid, \"have\" vs \"need\" counts |\n| [ ] | 239 | [Sliding Window Maximum](https://leetcode.com/problems/sliding-window-maximum/) | H | Monotonic deque |\n| [ ] | 992 | [Subarrays with K Different Integers](https://leetcode.com/problems/subarrays-with-k-different-integers/) | H | atMost(K) − atMost(K−1) |\n\n## My Notes\n\n-\n"}, {"id": "04-Stack", "file": "04-Stack.md", "title": "04 · Stack & Monotonic Stack", "md": "# 04 · Stack & Monotonic Stack\n\n> **Prereqs:** 01 · **Time:** 3 days\n\n## When to use\n\n- Matching or nesting: parentheses, tags, decoding strings like `3[a2[c]]`.\n- Expression evaluation (RPN, calculators).\n- **\"Next greater or smaller element\"** and \"how far until a warmer day\": use a **monotonic stack**.\n- \"Largest rectangle\" or \"span\" problems.\n- Undo operations, or emulating recursion iteratively.\n\n## Core concepts\n\n- LIFO, with O(1) push, pop and peek. In Java, use `Deque<Integer> st = new ArrayDeque<>()` with `push`, `pop` and `peek`. Avoid the old `Stack` class, which is synchronized and slower.\n- **Monotonic stack**: keeps elements in increasing or decreasing order. When a new element breaks the order, pop the stack. Each popped element has just found its \"next greater or smaller\" element.\n  - Use a decreasing stack to find the next **greater** element, and an increasing stack to find the next **smaller** one.\n- Store **indices** rather than values so you can calculate distances and widths.\n- Min stack: store the pair `int[]{value, currentMin}` at each level.\n\n## Templates\n\n```java\n// Next greater element (to the right)\nint[] res = new int[n];\nArrays.fill(res, -1);\nDeque<Integer> st = new ArrayDeque<>();   // indices, values decreasing\nfor (int i = 0; i < n; i++) {\n    while (!st.isEmpty() && nums[st.peek()] < nums[i])\n        res[st.pop()] = nums[i];\n    st.push(i);\n}\n\n// Circular variant: iterate i from 0 to 2n - 1, use i % n\n\n// Largest rectangle in histogram\nDeque<Integer> st = new ArrayDeque<>();   // indices, heights increasing\nint best = 0;\nfor (int i = 0; i <= heights.length; i++) {\n    int h = i == heights.length ? 0 : heights[i];   // sentinel 0 empties the stack\n    while (!st.isEmpty() && heights[st.peek()] > h) {\n        int height = heights[st.pop()];\n        int left = st.isEmpty() ? -1 : st.peek();\n        best = Math.max(best, height * (i - left - 1));\n    }\n    st.push(i);\n}\n```\n\n## Pitfalls\n\n- Popping from an empty stack. `pop()` on an empty `ArrayDeque` throws, so always check `!st.isEmpty() && ...`.\n- `ArrayDeque` doesn't accept `null`.\n- Elements left on the stack at the end need handling. Use a sentinel value or a post-processing step.\n- Deciding between strict and non-strict comparison (`<` vs `<=`) when values are duplicated.\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 20 | [Valid Parentheses](https://leetcode.com/problems/valid-parentheses/) | E | Matching |\n| [ ] | 232 | [Implement Queue using Stacks](https://leetcode.com/problems/implement-queue-using-stacks/) | E | Two stacks, amortized |\n| [ ] | 496 | [Next Greater Element I](https://leetcode.com/problems/next-greater-element-i/) | E | Monotonic |\n| [ ] | 155 | [Min Stack](https://leetcode.com/problems/min-stack/) | M | Pair (value, min) |\n| [ ] | 150 | [Evaluate Reverse Polish Notation](https://leetcode.com/problems/evaluate-reverse-polish-notation/) | M | Operand stack |\n| [ ] | 739 | [Daily Temperatures](https://leetcode.com/problems/daily-temperatures/) | M | Monotonic decreasing |\n| [ ] | 503 | [Next Greater Element II](https://leetcode.com/problems/next-greater-element-ii/) | M | Circular, 2n pass |\n| [ ] | 394 | [Decode String](https://leetcode.com/problems/decode-string/) | M | Stack of (string, count) |\n| [ ] | 853 | [Car Fleet](https://leetcode.com/problems/car-fleet/) | M | Sort + stack of times |\n| [ ] | 84 | [Largest Rectangle in Histogram](https://leetcode.com/problems/largest-rectangle-in-histogram/) | H | Monotonic increasing |\n| [ ] | 224 | [Basic Calculator](https://leetcode.com/problems/basic-calculator/) | H | Sign stack |\n\n## My Notes\n\n-\n"}, {"id": "05-Binary-Search", "file": "05-Binary-Search.md", "title": "05 · Binary Search", "md": "# 05 · Binary Search\n\n> **Prereqs:** 00 · **Time:** 3–4 days\n\n## When to use\n\n- A sorted array, or one that is sorted but rotated.\n- O(log n) is required, or n is around 10⁹.\n- **Binary search on the answer**: \"find the minimum speed, capacity or time such that the task is feasible\", where feasibility is **monotonic** (once it becomes true, it stays true).\n- Finding a boundary: the first or last occurrence, or a lower or upper bound.\n\n## Core concepts\n\n- Think of binary search as finding **the first index where `cond(i)` is true** in a sequence like `F F F T T T`.\n- Calculate `mid = lo + (hi - lo) / 2`. Writing `(lo + hi) / 2` can overflow `int` when both are large.\n- Rotated array: one half is always sorted, so work out which half it is and whether the target falls inside it.\n- `Arrays.binarySearch` returns *some* matching index (not necessarily the first), or `-(insertionPoint) - 1` if the key is missing. For the first or last occurrence, write the template yourself.\n- `TreeMap.floorKey(x)` / `ceilingKey(x)` give the nearest key ≤ x or ≥ x in O(log n).\n\n## Templates\n\n```java\n// Universal: first index where cond is true (lo..hi inclusive search space)\nint firstTrue(int lo, int hi, IntPredicate cond) {\n    while (lo < hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (cond.test(mid)) hi = mid;\n        else lo = mid + 1;\n    }\n    return lo;   // check cond(lo) if \"no answer\" is possible\n}\n\n// Binary search on answer (e.g. Koko)\nint lo = 1, hi = Arrays.stream(piles).max().getAsInt();\nwhile (lo < hi) {\n    int mid = lo + (hi - lo) / 2;\n    if (hoursNeeded(mid) <= h) hi = mid;   // hoursNeeded returns long\n    else lo = mid + 1;\n}\nreturn lo;\n\n// Classic exact match\nint l = 0, r = a.length - 1;\nwhile (l <= r) {\n    int m = l + (r - l) / 2;\n    if (a[m] == t) return m;\n    if (a[m] < t) l = m + 1;\n    else r = m - 1;\n}\nreturn -1;\n```\n\n## Pitfalls\n\n- Overflow inside the feasibility check: summing hours or loads can exceed `int`. Use a `long` accumulator.\n- Infinite loops from mixing up the templates (`lo < hi` with `hi = mid`, versus `lo <= hi` with `hi = mid - 1`). Pick one template and stick to it.\n- Setting the wrong search bounds for binary search on the answer (lo and hi must include every possible answer).\n- Rotated arrays with duplicates, which make the worst case O(n).\n\n## Problems\n\n| ✓ | # | Problem | Diff | Pattern |\n|---|---|---------|------|---------|\n| [ ] | 704 | [Binary Search](https://leetcode.com/problems/binary-search/) | E | Classic |\n| [ ] | 35 | [Search Insert Position](https://leetcode.com/problems/search-insert-position/) | E | Lower bound |\n| [ ] | 74 | [Search a 2D Matrix](https://leetcode.com/problems/search-a-2d-matrix/) | M | Flatten the index |\n| [ ] | 34 | [Find First and Last Position of Element in Sorted Array](https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/) | M | Two boundaries |\n| [ ] | 875 | [Koko Eating Bananas](https://leetcode.com/problems/koko-eating-bananas/) | M | Search on the answer |\n| [ ] | 1011 | [Capacity To Ship Packages Within D Days](https://leetcode.com/problems/capacity-to-ship-packages-within-d-days/) | M | Search on the answer |\n| [ ] | 153 | [Find Minimum in Rotated Sorted Array](https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/) | M | Compare with the right end |\n| [ ] | 33 | [Search in Rotated Sorted Array](https://leetcode.com/problems/search-in-rotated-sorted-array/) | M | Find the sorted half |\n| [ ] | 162 | [Find Peak Element](https://leetcode.com/problems/find-peak-element/) | M | Follow the slope |\n| [ ] | 981 | [Time Based Key-Value Store](https://leetcode.com/problems/time-based-key-value-store/) | M | TreeMap floorKey / binary search on timestamps |\n| [ ] | 410 | [Split Array Largest Sum](https://leetcode.com/problems/split-array-largest-sum/) | H | Search on the answer |\n| [ ] | 4 | [Median of Two Sorted Arrays](https://leetcode.com/problems/median-of-two-sorted-arrays/) | H | Partition search |\n\n## My Notes\n\n-\n"}, {"id": "06-Linked-List", "file": "06-Linked-List.md", "title": "06 · Linked List", "md": "# 06 · Linked List\n\n> **Prereqs:** 02 · **Time:** 3 days\n\n## When to use\n\n- The input is a linked list, or you're designing structures like an LRU cache (hash map plus doubly linked list).\n- Cycle detection, including \"find the duplicate\" problems on arrays treated as a linked list.\n\n## Core concepts\n\n- **Dummy (sentinel) node**: makes it easier to handle changes to the head.\n- **Fast/slow pointers (Floyd's algorithm)**: finds the middle of the list, detects cycles, and locates the start of a cycle.\n- **In-place reversal**: uses three pointers, `prev`, `cur` and `nxt`.\n- **The gap technique**: to remove the nth node from the end, move `fast` n steps ahead first.\n- Many problems are combinations of three steps: find the middle, reverse the second half, then merge.\n\n## Templates\n\n```java\n// Reverse\nListNode prev = null, cur = head;\nwhile (cur != null) {\n    ListNode nxt = cur.next;\n    cur.next = prev;\n    prev = cur;\n    cur = nxt;\n}\nreturn prev;\n\n// Middle (returns second middle for even length)\nListNode slow = head, fast = head;\nwhile (fast != null && fast.next != null) {\n    slow = slow.next;\n    fast = fast.next.next;\n}\n\n// Cycle start (Floyd)\nListNode slow = head, fast = head;\nwhile (fast != null && fast.next != null) {\n    slow = slow.next;\n    fast = fast.next.next;\n    if (slow == fast) {\n        ListNode p = head;\n        while (p != slow) {\n            p = p.next;\n            slow = slow.next;\n        }\n        return p;\n    }\n}\nreturn null;\n\n// Dummy node merge\nListNode dummy = new ListNode(), tail = dummy;\nwhile (a != null && b != null) {\n    if (a.val <= b.val) { tail.next = a; a = a.next; }\n    else { tail.next = b; b = b.next; }\n    tail = tail.next;\n}\ntail.next = (a != null) ? a
